openapi: 3.1.0
info:
  title: Core lead distribution private runtime API
  version: 1.0.0
  description: Implemented RS-04/RS-05/RS-06 private Core worker contract including observations, bounded recovery and fresh TeamOS decision authorization.
    Assignment requires a configured TeamOS registry, exact durable decision and service capabilities; missing or stale authority fails closed.
    Operators cannot release ambiguous guards through this API; no public ingress exposure.
servers:
- url: /
paths:
  /internal/v1/distribution/assignments:
    post:
      operationId: distributionAcceptAssignment
      summary: 'TeamOS → Core: принять назначение'
      x-authorization: TeamOS distribution principal; exact binding/capability/lead
        scope and fresh policy
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Принято после durable commit; ещё не выполнено. Повтор key+payload
            возвращает тот же receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReceipt'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentEnvelope'
      security: &id001
      - distributionSignature: []
    x-receiver: amocrm-core
    x-route-owner: worker
  /internal/v1/distribution/assignments/expire:
    post:
      operationId: distributionExpireAssignment
      summary: Зафиксировать отсутствие исполнения истёкшей команды
      description: >-
        Принимает исходный неизменённый AssignmentEnvelope и Idempotency-Key.
        Под общими блокировками admission возвращает существующую операцию,
        включая неизвестный исход, без изменений. Если операции нет и validUntil
        истёк по часам Core DB, атомарно сохраняет rejected/no_attempt с
        no_request_sent, terminal receipt и result outbox. Связанный job сразу
        cancelled; исполнимый job, guard и CRM PATCH не создаются. Поздний POST
        assignments получает тот же terminal receipt. Историческая binding
        проверяется полностью; pause/revoked capability не мешают завершению.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentEnvelope'
      responses:
        '200':
          description: Сохранённая операция; только terminal evidence разрешает освобождение защиты.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          description: invalid_transition до срока; idempotency_conflict при изменении intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Failure'
      security:
      - distributionSignature: []
    x-receiver: amocrm-core
    x-route-owner: worker
  /internal/v1/distribution/operations/{operationId}:
    parameters:
    - name: operationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    get:
      operationId: distributionGetOperation
      summary: 'TeamOS → Core: восстановить результат'
      x-authorization: Exact service principal+company/account/installation/binding
        scope; no cross-actor result disclosure
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
      security:
      - distributionSignature: []
    x-receiver: amocrm-core
    x-route-owner: worker
  /internal/v1/distribution/operations/{operationId}/reconcile:
    parameters:
    - name: operationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    post:
      operationId: distributionReconcileOperation
      summary: Повторная сверка неизвестного исхода
      x-authorization: Scoped TeamOS service or Core operator permission; expectedResultVersion
        CAS; no blind PATCH
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
        '200':
          description: Committed operation state; idempotent replay returns the original
            response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileInput'
      security:
      - distributionSignature: []
      description: Server records cancellation/request audit timestamp. Caller sends
        expectedResultVersion, verified actor and reason; proposed requestedAt is
        not accepted in the implemented private DTO.
    x-receiver: amocrm-core
    x-route-owner: worker
  /internal/v1/distribution/operations/{operationId}/cancel:
    x-receiver: amocrm-core
    parameters:
    - name: operationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    post:
      operationId: distributionCancelOperation
      summary: 'TeamOS → Core: запросить отмену'
      x-authorization: Historical immutable operation scope; current grants permit
        cancellation/reconciliation only; expectedResultVersion
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileInput'
      responses:
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
        '200':
          description: Committed operation state; idempotent replay returns the original
            response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
      security:
      - distributionSignature: []
      description: Server records cancellation/request audit timestamp. Caller sends
        expectedResultVersion, verified actor and reason; proposed requestedAt is
        not accepted in the implemented private DTO.
    x-route-owner: worker
  /internal/v1/distribution/bindings/{bindingId}/leads/{leadId}:
    get:
      operationId: getDistributionLeadObservation
      summary: Read an authorized current CRM observation
      parameters:
      - name: bindingId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: leadId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CrmId'
      responses:
        '200':
          description: Documented absence remains distinct from proven deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadObservation'
        '503':
          description: CRM unavailable or undocumented 404
      security: *id001
    x-route-owner: worker
  /internal/v1/distribution/bindings/{bindingId}/recovery-scans:
    post:
      operationId: startDistributionRecoveryScan
      parameters:
      - name: bindingId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '202':
          description: Durably accepted or scoped current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanReceipt'
        '409':
          description: Cursor or scope conflict
        '503':
          description: Source unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanInput'
      security: *id001
    x-route-owner: worker
  /internal/v1/distribution/bindings/{bindingId}/recovery-scans/{scanId}:
    get:
      operationId: getDistributionRecoveryScan
      parameters:
      - name: bindingId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: scanId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Durably accepted or scoped current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryScan'
        '409':
          description: Cursor or scope conflict
        '503':
          description: Source unavailable
      security: *id001
    x-route-owner: worker
  /internal/v1/distribution/bindings/{bindingId}/recovery-scans/{scanId}/retry:
    post:
      operationId: retryDistributionRecoveryScan
      parameters:
      - name: bindingId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: scanId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '202':
          description: Durably accepted or scoped current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanReceipt'
        '409':
          description: Cursor or scope conflict
        '503':
          description: Source unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRetryInput'
      security: *id001
    x-route-owner: worker
  /internal/v1/distribution/bindings/{bindingId}/delivery-status:
    get:
      operationId: getDistributionDeliveryStatus
      parameters:
      - name: bindingId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Durably accepted or scoped current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryStatus'
        '409':
          description: Cursor or scope conflict
        '503':
          description: Source unavailable
      security: *id001
    x-route-owner: worker
  /internal/v1/distribution/bindings/{bindingId}/references:
    get:
      operationId: distributionGetReferences
      summary: Получить актуальные справочники и часовой пояс подключённого аккаунта
      description: >-
        Справочники и часовой пояс читаются из аккаунта подтверждённой установки.
        Часовой пояс проверяется как IANA и не заменяется UTC при ошибке источника.
        Новые timezone/timezoneFetchedAt необязательны для совместимости со старыми
        версиями Core; их отсутствие не подтверждает часовой пояс аккаунта.
      parameters:
      - name: bindingId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: bindingRevision
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Revision'
      responses:
        '200':
          description: Подтверждённый снимок аккаунта; без прав и секретов пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionReferences'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
      security: *id001
    x-route-owner: worker
components:
  securitySchemes:
    distributionSignature:
      type: apiKey
      in: header
      name: X-Distribution-Signature
      description: Private HTTPS plus scoped HMAC key/company/installation/timestamp/nonce
        and exact body hash; signature alone is insufficient.
  schemas:
    DistributionReferences:
      type: object
      additionalProperties: false
      required: [users, pipelines, fetchedAt, freshUntil, state]
      properties:
        accountDomain:
          type: string
          minLength: 1
          maxLength: 253
          description: Канонический hostname подтверждённой установки amoCRM/Kommo; без схемы, пути и credentials. Используется для ссылок только после проверки прав на сделку.
        timezone:
          type: string
          minLength: 1
          maxLength: 128
          description: Валидированный IANA timezone аккаунта amoCRM; Local запрещён.
        timezoneFetchedAt:
          $ref: '#/components/schemas/Timestamp'
        fetchedAt:
          $ref: '#/components/schemas/Timestamp'
        freshUntil:
          $ref: '#/components/schemas/Timestamp'
        state:
          type: string
          enum: [fresh]
        users:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [id, name, isActive, groupId]
            properties:
              id:
                $ref: '#/components/schemas/CrmId'
              name:
                type: string
                maxLength: 512
              isActive:
                type: boolean
              groupId:
                anyOf:
                - type: string
                  pattern: ^[0-9]+$
                - type: 'null'
        pipelines:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id, name, statuses]
            properties:
              id:
                $ref: '#/components/schemas/CrmId'
              name:
                type: string
                maxLength: 512
              statuses:
                type: array
                maxItems: 200
                items:
                  type: object
                  additionalProperties: false
                  required: [id, name]
                  properties:
                    id:
                      $ref: '#/components/schemas/CrmId'
                    name:
                      type: string
                      maxLength: 512
    Id:
      type: string
      format: uuid
    CrmId:
      type: string
      pattern: ^[1-9][0-9]*$
      maxLength: 19
      description: Положительный CRM ID как decimal string; без float-конверсии и
        ведущих нулей. Semantic bound <=9223372036854775807 обязателен в приложении
        и fixtures; regex не доказывает upper bound.
    Revision:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: Safe JSON integer; proto uint64/DB bigint обязаны проверять тот
        же диапазон.
    Timestamp:
      type: string
      format: date-time
      description: RFC3339 UTC с Z; время наблюдения не равно времени факта источника.
    OperationState:
      type: string
      enum:
      - queued
      - prechecking
      - applying
      - outcome_unknown
      - confirming
      - succeeded
      - no_change
      - rejected
      - cancelled
      - conflict
    ExternalEffectState:
      type: string
      enum:
      - no_attempt
      - in_flight
      - unknown
      - settled
    OperationOutcome:
      type: string
      enum:
      - assigned
      - kept
      - already_target
      - source_changed
      - cancelled
      - rejected
      - conflict
    ErrorCode:
      type: string
      enum:
      - decision_expired
      - recipient_unavailable
      - validation_failed
      - unauthenticated
      - permission_denied
      - resource_not_found
      - binding_not_active
      - binding_mismatch
      - mapping_required
      - capability_revoked
      - unsupported_algorithm
      - stage_already_owned
      - revision_conflict
      - idempotency_conflict
      - operation_unresolved
      - invalid_transition
      - cursor_invalid
      - cursor_expired
      - source_unavailable
      - policy_unavailable
      - reauth_required
      - rate_limited
      - internal_error
      - distribution_rule_managed
    Scope:
      type: object
      properties:
        companyId:
          $ref: '#/components/schemas/Id'
        accountId:
          $ref: '#/components/schemas/CrmId'
        integrationId:
          $ref: '#/components/schemas/Id'
        installationId:
          $ref: '#/components/schemas/Id'
        bindingId:
          $ref: '#/components/schemas/Id'
        bindingRevision:
          $ref: '#/components/schemas/Revision'
      required:
      - companyId
      - accountId
      - integrationId
      - installationId
      - bindingId
      - bindingRevision
      additionalProperties: false
    LeadSnapshot:
      type: object
      properties:
        leadId:
          $ref: '#/components/schemas/CrmId'
        pipelineId:
          $ref: '#/components/schemas/CrmId'
        statusId:
          $ref: '#/components/schemas/CrmId'
        responsibleUserId:
          anyOf:
          - $ref: '#/components/schemas/CrmId'
          - type: 'null'
        sourceUpdatedAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        observedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
      - leadId
      - pipelineId
      - statusId
      - responsibleUserId
      - observedAt
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              minLength: 1
              maxLength: 1000
            status:
              type: integer
              minimum: 400
              maximum: 599
            code:
              $ref: '#/components/schemas/ErrorCode'
            requestId:
              $ref: '#/components/schemas/Id'
            details:
              type: object
              properties:
                field:
                  type: string
                  maxLength: 120
                currentRevision:
                  $ref: '#/components/schemas/Revision'
                operationId:
                  $ref: '#/components/schemas/Id'
                retryAfterSeconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
              required: []
              additionalProperties: false
          required:
          - message
          - status
          - code
          - requestId
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Actor:
      type: object
      properties:
        kind:
          type: string
          enum:
          - user
          - system
        teamosUserId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        crmUserId:
          anyOf:
          - $ref: '#/components/schemas/CrmId'
          - type: 'null'
        operatorId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - kind
      additionalProperties: false
      description: Actor из проверенного server context; не доверять значению browser
        payload.
      allOf:
      - if:
          properties:
            kind:
              const: user
        then:
          required:
          - teamosUserId
          - crmUserId
          properties:
            teamosUserId:
              $ref: '#/components/schemas/Id'
            crmUserId:
              $ref: '#/components/schemas/CrmId'
    AssignmentEnvelope:
      type: object
      properties:
        schemaVersion:
          type: integer
          const: 1
        messageId:
          $ref: '#/components/schemas/Id'
        scope:
          $ref: '#/components/schemas/Scope'
        eventId:
          $ref: '#/components/schemas/Id'
        sourceEventId:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
        sourceOccurredAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        receivedAt:
          $ref: '#/components/schemas/Timestamp'
        emittedAt:
          $ref: '#/components/schemas/Timestamp'
        correlationId:
          $ref: '#/components/schemas/Id'
        causationId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        command:
          type: object
          properties:
            operationId:
              $ref: '#/components/schemas/Id'
            episodeId:
              $ref: '#/components/schemas/Id'
            decisionId:
              $ref: '#/components/schemas/Id'
            ruleId:
              $ref: '#/components/schemas/Id'
            ruleRevision:
              $ref: '#/components/schemas/Revision'
            decisionKind:
              type: string
              enum:
              - assign
              - keep
            targetResponsibleUserId:
              $ref: '#/components/schemas/CrmId'
            expectedSnapshot:
              $ref: '#/components/schemas/LeadSnapshot'
            actor:
              $ref: '#/components/schemas/Actor'
            validUntil:
              $ref: '#/components/schemas/Timestamp'
            groupId: &id002
              $ref: '#/components/schemas/Id'
            availabilityRevision: &id003
              $ref: '#/components/schemas/Revision'
            claimRevision: &id004
              $ref: '#/components/schemas/Revision'
          required:
          - operationId
          - episodeId
          - decisionId
          - ruleId
          - ruleRevision
          - decisionKind
          - targetResponsibleUserId
          - expectedSnapshot
          - actor
          - validUntil
          - groupId
          - availabilityRevision
          - claimRevision
          additionalProperties: false
          description: keep никогда не делает PATCH; target должен совпасть с expectedSnapshot.responsibleUserId.
            При несовпадении source возвращается source_changed.
      required:
      - schemaVersion
      - messageId
      - scope
      - eventId
      - sourceEventId
      - sourceOccurredAt
      - receivedAt
      - emittedAt
      - correlationId
      - causationId
      - command
      additionalProperties: false
      description: System actor действует по binding/rule, user по свежим user checks.
        operationId постоянен при retry. validUntil ограничивает admission/precheck,
        но не доказывает отсутствие уже отправленного PATCH.
    OperationError:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 1000
        retryable:
          type: boolean
        terminal:
          type: boolean
        retryAfterSeconds:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 86400
          - type: 'null'
      required:
      - code
      - message
      - retryable
      - terminal
      - retryAfterSeconds
      additionalProperties: false
    ResolutionEvidence:
      type: object
      properties:
        kind:
          type: string
          enum:
          - no_request_sent
          - response_and_observation
          - observed_state_only
          - operator_reconciliation
        observedAt:
          $ref: '#/components/schemas/Timestamp'
        guardReleasable:
          type: boolean
        explanation:
          type: string
          maxLength: 1000
      required:
      - kind
      - observedAt
      - guardReleasable
      - explanation
      additionalProperties: false
      description: observed_state_only не снимает late-PATCH uncertainty. settled+outcome
        описывают результат раздельно; claim release требует evidence.
      allOf:
      - if:
          properties:
            kind:
              const: observed_state_only
        then:
          properties:
            guardReleasable:
              const: false
    Operation:
      type: object
      properties:
        operationId:
          $ref: '#/components/schemas/Id'
        scope:
          $ref: '#/components/schemas/Scope'
        episodeId:
          $ref: '#/components/schemas/Id'
        decisionId:
          $ref: '#/components/schemas/Id'
        ruleId:
