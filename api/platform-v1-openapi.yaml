openapi: 3.1.0
info:
  title: Rakurs Platform V1
  version: 1.0.0
  description: Контракт Core lifecycle, доступа виджета и закрытых операций для BFF. Порядок проверок и доверие описаны в docs/platform-v1-contract.md.
paths:
  /internal/platform/v1/core-events:
    post:
      operationId: recordCoreEvent
      security:
      - coreService: []
      responses:
        '202':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LifecycleReceipt'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - {$ref: '#/components/schemas/CoreLifecycleEvent'}
              - {$ref: '#/components/schemas/CoreAuthorizationEvent'}
      description: Подтверждает запись в inbox. Идентичная повторная доставка получает тот же receipt. Другой payload для event_id или другой
        event_id для той же позиции в потоке получает 409.
  /api/v1/widget/activation:
    get:
      operationId: getWidgetActivation
      security: [{coreWidgetSDK: []}, {coreWidgetBearer: []}]
      responses:
        '200':
          description: Current activation status and, before activation, the verified employee profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WidgetActivationStatus'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
    post:
      operationId: submitWidgetActivation
      security: [{coreWidgetSDK: []}, {coreWidgetBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, consent_version]
              properties:
                phone: {type: string, maxLength: 48}
                consent_version: {type: string, enum: [contact-v1]}
      responses:
        '200':
          description: The episode has been activated. A repeat preserves the original contact.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WidgetActivationStatus'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
  /internal/platform/v1/activation:
    post:
      operationId: recordVerifiedWidgetActivation
      security: [{coreService: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope]
              properties:
                scope:
                  type: object
                  additionalProperties: false
                  required: [installation_id, integration_id, amo_account_id, generation, authorization_sequence]
                  properties:
                    installation_id: {type: string, format: uuid}
                    integration_id: {type: string, format: uuid}
                    amo_account_id: {type: integer, format: int64, minimum: 1}
                    generation: {type: integer, minimum: 1}
                    authorization_sequence: {type: integer, minimum: 1}
                contact:
                  type: object
                  additionalProperties: false
                  required: [amo_user_id, name, phone, consent_version]
                  properties:
                    amo_user_id: {type: integer, format: int64, minimum: 1}
                    name: {type: string, maxLength: 512}
                    phone: {type: string, pattern: '^\+[1-9][0-9]{7,14}$'}
                    email: {type: string, maxLength: 320}
                    role: {type: string, maxLength: 256}
                    consent_version: {type: string, enum: [contact-v1]}
      responses:
        '200':
          description: Active episode and recorded activation status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WidgetActivationStatus'}
        '400': {description: Invalid scope or contact.}
        '403': {description: Core TLS identity required.}
        '404': {description: Current authorized installation episode unavailable.}
        '503': {description: Activation store unavailable.}
  /api/v1/widget/platform-access-proof:
    post:
      operationId: issuePlatformAccessProof
      security:
      - coreWidgetSDK: []
      - coreWidgetBearer: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProofIssued'}
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      description: 'Маршрут Core. Тело не требуется. Выбирает продукт из утверждённой привязки integration_id после существующего widget admission.
        Ответ содержит Cache-Control: no-store.'
  /v1/access/{amo_account_id}/{product_code}:
    get:
      operationId: getWidgetAccess
      security:
      - widgetProof: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessState'}
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {name: amo_account_id, in: path, required: true, schema: {$ref: '#/components/schemas/AmoID'}}
      - {name: product_code, in: path, required: true, schema: {$ref: '#/components/schemas/ProductCode'}}
      description: 'Проверяет proof, его область и актуальное поколение. Доступ вычисляется по локальному сроку. Ответ содержит Cache-Control:
        no-store.'
  /v1/installations/{id}/activation:
    post:
      operationId: activateInstallation
      security:
      - activationProof: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Activation'}
          headers:
            ETag:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 1000}
                phone: {type: string}
                contact_role: {type: string}
                consent_version: {type: string}
              required:
              - name
              - phone
              - consent_version
      x-release-capability: verified_activation
  /internal/platform/v1/managers/installations:
    get:
      operationId: listInstallations
      security:
      - adminService: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationList'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/Actor'}
      - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      - {name: cursor, in: query, required: false, schema: {type: string}}
      - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
      - {name: review, in: query, required: false, schema: {type: string, enum: [reviewed, unreviewed]}}
      - {name: kind, in: query, required: false, schema: {type: string, enum: [install, reinstall]}}
      - {name: last_lifecycle_event, in: query, required: false, schema: {$ref: '#/components/schemas/LifecycleKind'}}
      - {name: product_id, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: line, in: query, required: false, schema: {type: string, enum: [FREE, TOP, PRO]}}
      - {name: activation, in: query, required: false, schema: {type: string}}
      - {name: access_state, in: query, required: false, schema: {type: string, enum: [active, inactive]}}
      - {name: from, in: query, required: false, schema: {type: string, format: date}}
      - {name: to, in: query, required: false, schema: {type: string, format: date}}
      - {name: sort, in: query, required: false, schema: {type: string, enum: [installed_at, -installed_at]}}
      x-platform-grant: clients.read
  /internal/platform/v1/managers/installations/{id}/crm-deal/retry:
    post:
      operationId: retryInstallationDeal
      security:
      - adminService: []
      responses:
        '202':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/Actor'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, minLength: 1, maxLength: 1000}
              required:
              - reason
      x-platform-grant: clients.write
  /internal/platform/v1/managers/installations/{id}/review:
    put:
      operationId: setInstallationReview
      security:
      - adminService: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Installation'}
          headers:
            ETag:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/Actor'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reviewed: {type: boolean}
                reason: {type: string, minLength: 1, maxLength: 1000}
              required:
              - reviewed
      x-platform-grant: clients.write
  /internal/platform/v1/managers/installations/{id}/activation-contact:
    patch:
      operationId: updateInstallationContact
      security:
      - adminService: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Installation'}
          headers:
            ETag:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/Actor'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 1000}
                phone: {type: string}
                contact_role: {type: string}
                reason: {type: string, minLength: 1, maxLength: 1000}
              required:
              - name
              - phone
              - contact_role
              - reason
      x-platform-grant: clients.write
      x-release-capability: verified_activation
  /internal/platform/v1/managers/accounts:
    get:
      operationId: listAccounts
      security:
      - adminService: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountList'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/Actor'}
      - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      - {name: cursor, in: query, required: false, schema: {type: string}}
      - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
      - {name: classification, in: query, required: false, schema: {type: array, items: {type: string}}}
      - {name: product_id, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: license_before, in: query, required: false, schema: {type: string, format: date-time}}
      - {name: data_group, in: query, required: false, schema: {type: string, enum: [receiving, no_data, blocked]}}
      - {name: tariff, in: query, required: false, schema: {type: string, enum: [FREE, TOP, PRO, trial]}}
      - {name: renewal_channel, in: query, required: false, schema: {type: string, enum: [direct, partner]}}
      - {name: active_users_min, in: query, required: false, schema: {type: integer, minimum: 0}}
      - {name: active_users_max, in: query, required: false, schema: {type: integer, minimum: 0}}
      - {name: sort, in: query, required: false, schema: {type: string, enum: [amo_account_id, current_domain, display_name, license_until, -license_until]}}
      x-platform-grant: clients.read
  /internal/platform/v1/managers/accounts/search:
    post:
      operationId: searchAccounts
      security:
      - adminService: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountList'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/Actor'}
      - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      - {name: cursor, in: query, required: false, schema: {type: string}}
      - {name: q, in: query, required: false, schema: {type: string, maxLength: 200}}
      - {name: classification, in: query, required: false, schema: {type: array, items: {type: string}}}
      - {name: product_id, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: license_before, in: query, required: false, schema: {type: string, format: date-time}}
      - {name: data_group, in: query, required: false, schema: {type: string, enum: [receiving, no_data, blocked]}}
      - {name: tariff, in: query, required: false, schema: {type: string, enum: [FREE, TOP, PRO, trial]}}
      - {name: renewal_channel, in: query, required: false, schema: {type: string, enum: [direct, partner]}}
      - {name: active_users_min, in: query, required: false, schema: {type: integer, minimum: 0}}
      - {name: active_users_max, in: query, required: false, schema: {type: integer, minimum: 0}}
      - {name: sort, in: query, required: false, schema: {type: string, enum: [amo_account_id, current_domain, display_name, license_until, -license_until]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                portrait_filter: {$ref: '#/components/schemas/PortraitFilter'}
              required:
              - portrait_filter
      x-platform-grant: clients.read
      description: До 3 уровней и 30 условий. Тип значения задаёт поле шаблона. Операция чтения.
  /internal/platform/v1/managers/accounts/{id}:
    get:
      operationId: getAccount
      security:
      - adminService: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountDetail'}
          headers:
            ETag:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/Actor'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      x-platform-grant: clients.read
  /internal/platform/v1/managers/accounts/{id}/profile:
    patch:
      operationId: updateAccountProfile
      security:
      - adminService: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountDetail'}
          headers:
            ETag:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/Actor'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/IfMatch'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: {type: [string, 'null']}
                note: {type: [string, 'null']}
                classification:
                  type: [string, 'null']
                  enum: ['Без партнёра', 'Запрет работы', 'Клиент партнёра', 'Наш клиент', null]
                partner_name: {type: [string, 'null'], maxLength: 200}
                reason: {type: string, minLength: 1, maxLength: 1000}
              required:
              - reason
      x-platform-grant: clients.write
  /internal/platform/v1/managers/accounts/{id}/refresh:
    post:
      operationId: requestAccountRefresh
      security:
      - adminService: []
      responses:
        '202':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '422': {$ref: '#/components/responses/Error422'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/Actor'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                components: {type: array, items: {type: string, enum: [license, users]}, minItems: 1, uniqueItems: true}
                reason: {type: string, minLength: 1, maxLength: 1000}
              required:
              - components
              - reason
      x-platform-grant: clients.write
  /internal/platform/v1/managers/accounts/{id}/license-history:
    get:
      operationId: getAccountLicenseHistory
      security:
      - adminService: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LicenseEvidenceList'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/Actor'}
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      - {name: cursor, in: query, required: false, schema: {type: string}}
      - {name: from, in: query, required: false, schema: {type: string, format: date}}
      - {name: to, in: query, required: false, schema: {type: string, format: date}}
      x-platform-grant: clients.read
  /internal/platform/v1/managers/accounts/{id}/widgets:
    get:
      operationId: listAccountWidgets
      security:
      - adminService: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstallationList'}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '429': {$ref: '#/components/responses/Error429'}
        '503': {$ref: '#/components/responses/Error503'}
      parameters:
      - {$ref: '#/components/parameters/Actor'}
