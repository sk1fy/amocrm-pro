        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProductCompanyWorkflow'
      description: Команда product.company_workflow.set. Первая запись меняет виртуальную версию 1 на 2. Проверяет принятую
        карточку продукта и свежее полное поколение метаданных в SQL. 409/422 сохраняют receipt. 503 откатывает резервирование
        ключа. Точный повтор успеха возвращает сохранённые байты и ETag даже после outage или rebind, при текущем catalog.manage
        и видимом продукте. write_ready всегда false.
