components:
  securitySchemes:
    adminService: {type: mutualTLS, description: Закрытый listener проверяет сертификат вызывающего BFF.}
    coreService: {type: mutualTLS, description: Закрытый listener принимает только Core identity.}
    coreWidgetSDK: {type: apiKey, in: header, name: X-Auth-Token, description: Одноразовый amoCRM Web SDK JWT. Используйте ровно один способ передачи.}
    coreWidgetBearer: {type: http, scheme: bearer, bearerFormat: JWT, description: Совместимый способ передачи того же одноразового JWT.}
    widgetProof: {type: http, scheme: bearer, bearerFormat: JWT}
    activationProof: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Actor: {name: X-Platform-Actor, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 4096}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[1-9][0-9]*"$'}}
  responses:
    Error400:
      description: Некорректные параметры
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error401:
      description: Требуется аутентификация
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error403:
      description: Нет права
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error404:
      description: Ресурс недоступен в области доступа
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error409:
      description: Конфликт состояния, версии или ключа
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error422:
      description: Нарушено продуктовое правило
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
