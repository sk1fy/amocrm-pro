      type: object
      additionalProperties: false
      properties:
        items:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/CompanySummary'
          - type: 'null'
        next_cursor:
          anyOf:
          - *id002
          - type: 'null'
