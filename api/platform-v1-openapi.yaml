components:
  securitySchemes:
    adminService: {type: mutualTLS, description: Закрытый listener проверяет сертификат вызывающего BFF.}
    coreService: {type: mutualTLS, description: Закрытый listener принимает только Core identity.}
    coreWidgetSDK: {type: apiKey, in: header, name: X-Auth-Token, description: Одноразовый amoCRM Web SDK JWT. Используйте ровно один способ передачи.}
    coreWidgetBearer: {type: http, scheme: bearer, bearerFormat: JWT, description: Совместимый способ передачи того же одноразового JWT.}
    widgetProof: {type: http, scheme: bearer, bearerFormat: JWT}
    activationProof: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Actor: {name: X-Platform-Actor, in: header, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 4096}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[1-9][0-9]*"$'}}
  responses:
    Error400:
      description: Некорректные параметры
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error401:
      description: Требуется аутентификация
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error403:
      description: Нет права
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error404:
      description: Ресурс недоступен в области доступа
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error409:
      description: Конфликт состояния, версии или ключа
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error422:
      description: Нарушено продуктовое правило
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error429:
      description: Превышен лимит
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
      headers:
        Retry-After:
          schema: {type: string}
    Error503:
      description: Источник недоступен
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
      headers:
        Retry-After:
          schema: {type: string}
  schemas:
    AmoID: {type: string, pattern: '^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$'}
    ProductCode: {type: string, maxLength: 63, pattern: '^[a-z0-9]+(?:[-_][a-z0-9]+)*$'}
    Version: {type: integer, minimum: 1, maximum: 9007199254740991}
    Grant: {type: string, enum: [catalog.manage, catalog.read, clients.read, clients.renew, clients.write, configuration.manage, feed.read, identity.manage,
        security.audit.read, staff.manage, stats.read]}
    Freshness: {type: string, enum: [fresh, stale, unknown, unavailable, unsupported]}
    LifecycleKind: {type: string, enum: [installed, reinstalled, reauthorized, uninstalled]}
    ManagerIdentity:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        name: {type: string}
        grants: {type: array, items: {$ref: '#/components/schemas/Grant'}, minItems: 1, maxItems: 11, uniqueItems: true}
      required:
      - id
      - email
      - name
      - grants
    ManagerActor:
      type: object
      additionalProperties: false
      properties:
        kind: {type: string, enum: [employee]}
        subject_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        audience: {type: string, enum: [managers]}
        grants: {type: array, items: {$ref: '#/components/schemas/Grant'}, minItems: 1, maxItems: 11, uniqueItems: true}
        grants_version: {type: integer, minimum: 1, maximum: 9007199254740991}
      required:
      - kind
      - subject_id
      - session_id
      - audience
      - grants
      - grants_version
    ManagerContext:
      type: object
      additionalProperties: false
      properties:
        actor: {$ref: '#/components/schemas/ManagerActor'}
        request_id: {type: string, format: uuid}
        trace_id: {type: string}
        command_id: {type: string, format: uuid}
        issued_at: {type: string, format: date-time}
        deadline_at: {type: string, format: date-time}
      required:
      - actor
      - request_id
      - issued_at
      - deadline_at
    CoreLifecycleEvent:
      type: object
      additionalProperties: false
      properties:
        schema_version: {type: integer, enum: [1]}
        event_id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/LifecycleKind'}
        occurred_at: {type: string, format: date-time}
        amo_account_id: {$ref: '#/components/schemas/AmoID'}
        integration_id: {type: string, format: uuid}
        core_installation_id: {type: string, format: uuid}
        generation: {type: integer, minimum: 1, maximum: 9007199254740991}
        sequence: {type: integer, minimum: 1, maximum: 9007199254740991}
        evidence:
          type: object
          additionalProperties: false
          properties:
            source: {type: string, enum: [core_oauth, core_uninstall]}
            ref: {type: string, format: uuid}
          required:
          - source
          - ref
      required:
      - schema_version
      - event_id
      - kind
      - occurred_at
      - amo_account_id
      - integration_id
      - core_installation_id
      - generation
      - sequence
      - evidence
    CoreAuthorizationEvent:
      type: object
      additionalProperties: false
      properties:
        schema_version: {type: integer, enum: [1]}
        event_id: {type: string, format: uuid}
        kind: {type: string, enum: [authorization_changed]}
        occurred_at: {type: string, format: date-time}
        amo_account_id: {$ref: '#/components/schemas/AmoID'}
        integration_id: {type: string, format: uuid}
        core_installation_id: {type: string, format: uuid}
        generation: {type: integer, minimum: 1, maximum: 9007199254740991}
        sequence: {type: integer, minimum: 1, maximum: 9007199254740991}
        authorization: {type: string, enum: [authorized, reauth_required, disabled, unknown]}
        evidence:
          type: object
          additionalProperties: false
          properties:
            source: {type: string, enum: [core_policy]}
            ref: {type: string, format: uuid}
          required:
          - source
          - ref
      required:
      - schema_version
      - event_id
      - kind
      - occurred_at
      - amo_account_id
      - integration_id
      - core_installation_id
      - generation
      - sequence
      - authorization
      - evidence
    ProofIssued:
      type: object
      additionalProperties: false
      properties:
        proof: {type: string}
        expires_at: {type: string, format: date-time}
      required:
      - proof
      - expires_at
    LifecycleReceipt:
      type: object
      additionalProperties: false
      properties:
        event_id: {type: string, format: uuid}
        state: {type: string, enum: [recorded]}
      required:
      - event_id
      - state
    ProofClaims:
      type: object
      additionalProperties: false
      properties:
        iss: {type: string, enum: [core]}
        aud: {type: string, enum: [platform-access-v1]}
        sub: {$ref: '#/components/schemas/AmoID'}
        product_code: {$ref: '#/components/schemas/ProductCode'}
        integration_id: {type: string, format: uuid}
        core_installation_id: {type: string, format: uuid}
        generation: {type: integer, minimum: 1, maximum: 9007199254740991}
        authorization_sequence: {type: integer, minimum: 1, maximum: 9007199254740991}
        iat: {type: integer, minimum: 0}
        nbf: {type: integer, minimum: 0}
        exp: {type: integer, minimum: 0}
      required:
      - iss
      - aud
      - sub
      - product_code
      - integration_id
      - core_installation_id
      - generation
      - authorization_sequence
      - iat
      - nbf
      - exp
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string, format: uuid}
            retryable: {type: boolean}
            retry_after_seconds: {type: integer, minimum: 0}
            current_version: {type: integer, minimum: 1, maximum: 9007199254740991}
            operation_id: {type: string, format: uuid}
            field_errors: {type: array, items: {type: object, additionalProperties: false, properties: {field: {type: string}, code: {type: string}},
                required: [field, code]}}
          required:
          - code
          - message
          - request_id
          - retryable
      required:
      - error
    AccessState:
      type: object
      additionalProperties: false
      properties:
        account_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        active: {type: boolean}
        valid_until: {type: [string, 'null'], format: date-time}
        source: {type: string, enum: [own_trial, free, own_paid, manual, none]}
        reason_codes: {type: array, items: {type: string}}
        own_until: {type: [string, 'null'], format: date-time}
        entitlement_version: {type: integer, minimum: 1, maximum: 9007199254740991}
        computed_at: {type: string, format: date-time}
      required:
      - account_id
      - product_id
      - active
      - valid_until
      - source
      - reason_codes
      - own_until
      - entitlement_version
      - computed_at
    ObservationCount:
      type: object
      additionalProperties: false
      properties:
        state: {$ref: '#/components/schemas/Freshness'}
        value: {type: integer, minimum: 0}
        source: {type: string}
        observed_at: {type: string, format: date-time}
        fresh_until: {type: string, format: date-time}
        evidence_id: {type: string, format: uuid}
        error_code: {type: string}
      required:
      - state
      - source
    ObservationDate:
      type: object
      additionalProperties: false
      properties:
        state: {$ref: '#/components/schemas/Freshness'}
        value: {type: string, format: date-time}
        source: {type: string}
        observed_at: {type: string, format: date-time}
        fresh_until: {type: string, format: date-time}
        evidence_id: {type: string, format: uuid}
        error_code: {type: string}
      required:
      - state
      - source
    ObservationLicense:
      type: object
      additionalProperties: false
      properties:
        state: {$ref: '#/components/schemas/Freshness'}
        value:
          type: object
          additionalProperties: false
          properties:
            license_until: {type: [string, 'null'], format: date-time}
            paid_seat_limit: {type: [integer, 'null'], minimum: 0}
            tariff: {type: [string, 'null']}
        source: {type: string}
        observed_at: {type: string, format: date-time}
        fresh_until: {type: string, format: date-time}
        evidence_id: {type: string, format: uuid}
        error_code: {type: string}
      required:
      - state
      - source
    ObservationCRMUsers:
      type: object
      additionalProperties: false
      properties:
        state: {$ref: '#/components/schemas/Freshness'}
        value: {type: array, items: {type: object, additionalProperties: false, properties: {id: {$ref: '#/components/schemas/AmoID'}, name: {
                type: string}, is_active: {type: boolean}, is_admin: {type: boolean}}, required: [id, name, is_active, is_admin]}}
        source: {type: string}
        observed_at: {type: string, format: date-time}
        fresh_until: {type: string, format: date-time}
        evidence_id: {type: string, format: uuid}
        error_code: {type: string}
      required:
      - state
      - source
    Review:
      type: object
      additionalProperties: false
      properties:
        reviewed: {type: boolean}
        reviewed_by: {type: string, format: uuid}
        reviewed_at: {type: string, format: date-time}
      required:
      - reviewed
    InstallationActivationContact:
      type: object
      additionalProperties: false
      required: [amo_user_id, name, phone]
      properties:
        amo_user_id: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        name: {type: string, maxLength: 512}
        phone: {type: string, pattern: '^\+[1-9][0-9]{7,14}$'}
        email: {type: string, maxLength: 320}
        role: {type: string, maxLength: 256}
    InstallationDeal:
      type: object
      additionalProperties: false
      required: [state, retry_version, can_retry]
      properties:
        state: {type: string, enum: [pending, reconciling, failed, skipped, succeeded]}
        url: {type: string, format: uri}
        id: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        reason: {type: string}
        next_run_at: {type: string, format: date-time}
        retry_version: {type: integer, minimum: 1, maximum: 2147483647}
        can_retry: {type: boolean}
    WidgetActivationStatus:
      type: object
      additionalProperties: false
      required: [activated]
      properties:
        activated: {type: boolean}
        profile:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: {type: string}
            email: {type: string}
            role: {type: string}
    Installation:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        amo_account_id: {$ref: '#/components/schemas/AmoID'}
        product_id: {type: string, format: uuid}
        product_code: {$ref: '#/components/schemas/ProductCode'}
        product_name: {type: string}
        product_line: {type: string, enum: [FREE, TOP, PRO]}
