    CompanyProjectionId:
      type: string
      format: uuid
      description: UUID проекции CRM-компании. Не является runtime account_id.
    CompanySource:
      type: object
      additionalProperties: false
      properties:
        source_account_id:
          anyOf:
          - $ref: '#/components/schemas/AmoID'
          - type: 'null'
        binding_revision:
          anyOf:
          - &id002
            type: string
          - type: 'null'
        state:
          type: string
          enum:
          - fresh
          - stale
          - error
          - disabled
        complete:
          type: boolean
        observed_at:
          anyOf:
          - &id001
            type: string
            format: date-time
          - type: 'null'
        fresh_until:
          anyOf:
          - *id001
          - type: 'null'
        error_code:
          anyOf:
          - *id002
          - type: 'null'
        retry_at:
          anyOf:
          - *id001
          - type: 'null'
      required:
      - source_account_id
      - binding_revision
      - state
      - complete
      - observed_at
      - fresh_until
      - error_code
      - retry_at
      description: Времена относятся к полному поколению данных. Ошибка последней попытки не заменяет данные; локальное истечение
        переводит fresh в stale. Смена активной привязки очищает текущий снимок.
    CompanyRuntimeAccount:
      type: object
      additionalProperties: false
      properties:
        account_id: &id009
          type: string
          format: uuid
        customer_account_id:
          $ref: '#/components/schemas/AmoID'
      required:
      - account_id
      - customer_account_id
    CompanySummary:
      type: object
      additionalProperties: false
      properties:
        id: &id003
          $ref: '#/components/schemas/CompanyProjectionId'
        crm_company_id: &id004
          $ref: '#/components/schemas/AmoID'
        name: *id002
        customer_account_ids: &id005
          type: array
          items:
            $ref: '#/components/schemas/AmoID'
        source_resolution: &id006
          type: string
          enum:
          - unknown
          - zero
          - one
          - multiple
        runtime_resolution: &id007
          type: string
          enum:
          - unresolved
          - resolved
          - partial
          - ambiguous
        runtime_accounts: &id008
          type: array
          items:
            $ref: '#/components/schemas/CompanyRuntimeAccount'
      required:
      - id
      - crm_company_id
      - name
      - customer_account_ids
      - source_resolution
      - runtime_resolution
      - runtime_accounts
