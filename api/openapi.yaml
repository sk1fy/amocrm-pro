components:
  securitySchemes:
    widgetToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: >-
        Primary amoCRM Web SDK authentication. Supply exactly one fresh,
        disposable JWT as the header value. Do not combine this scheme with
        widgetBearer; requests containing both token headers are rejected.
    widgetBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Compatibility authentication for non-browser clients. Supply exactly
        one fresh, disposable JWT as a Bearer credential. Do not combine this
        scheme with widgetToken; requests containing both token headers are
        rejected. Both alternatives use atomic `jti` replay protection.
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional UUID correlation ID. Invalid values are replaced.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Opaque 1-128 character key. The raw value is never persisted; retries
        use a fresh JWT and the same key.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  headers:
    RequestID:
      description: UUID correlation ID accepted or generated by the API.
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ActivityError:
      type: object
      description: >-
        Activity JSON error. `code` is the stable discriminator. `message` is a
        generic safe phrase and never copies upstream or database details.
        `reauth_required` is HTTP 403 without WWW-Authenticate, distinct from
        `permission_denied` (also 403) and `unauthenticated` (401 with Bearer).
        `retryable` is true only for unavailable, resource_exhausted and
        deadline_exceeded. Widget limiter 429 may still use `rate_limited` with
        the smaller widget envelope.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - invalid_argument
              - unauthenticated
              - permission_denied
              - not_found
              - conflict
              - unavailable
              - deadline_exceeded
              - resource_exhausted
              - reauth_required
              - internal
              - rate_limited
            message:
              type: string
              minLength: 1
            request_id:
              type: string
            retryable:
              type: boolean
          required:
          - code
          - message
          - request_id
          - retryable
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    OAuthError:
      type: object
      description: >-
        OAuth start/callback JSON error. Start failures use invalid_argument and
        the same body for missing and other integration_code failures so account
        existence is not revealed. Rate-limited responses are identical for
        known and unknown codes.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - invalid_argument
              - unavailable
              - rate_limited
            message:
              type: string
              minLength: 1
            request_id:
              type: string
            retryable:
              type: boolean
          required:
          - code
          - message
          - request_id
          - retryable
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    ActivitySettings:
      type: object
      properties:
        initial_days:
          type: integer
          minimum: 1
          maximum: 7
          default: 2
        retention_days:
          type: integer
          minimum: 2
          maximum: 30
          default: 7
      required:
      - initial_days
      - retention_days
      additionalProperties: false
      description: Product defaults for the next sync command; retention_days must be at least initial_days. CRM Events
        owns retention execution. Already admitted commands keep their settings snapshot.
    ActivitySyncCommand:
      type: object
      properties:
        kind:
          type: string
          enum:
          - enable
          - disable
          - sync
          - backfill
          default: sync
        from: &id001
          type: integer
          format: int64
          minimum: 0
        to: *id001
      required: []
      additionalProperties: false
      description: sync/enable registers the Activity consumer and starts or resumes collection; disable pauses that
        consumer. backfill requires a past [from,to] interval within retention and at most 31 days. Initial/retention
        settings are read through Activity by Core. Tenant and actor fields are forbidden.
    ActivitySyncStatus:
      type: object
      properties:
        history_from: *id001
        verified_from: *id001
        verified_through: *id001
        window_from: *id001
        window_to: *id001
        last_success_at: *id001
        last_event_at: *id001
        lag_seconds: *id001
        enabled:
          type: boolean
        state: &id002
          type: string
        next_page: *id001
        error_code: *id002
        reauth_required:
          type: boolean
        verification: *id002
      required:
      - history_from
      - verified_from
      - verified_through
      - window_from
      - window_to
      - last_success_at
      - last_event_at
      - lag_seconds
      - enabled
      - state
      - next_page
      - reauth_required
      - verification
      additionalProperties: false
      description: All times are Unix seconds. Zero verified bounds mean unknown. History retention and continuous verification
        are separate. verification=stabilized_api_scan means two equal bounded API scans, not a guarantee against later
        source mutations or inaccessible history.
    ActivityEvent:
      type: object
      properties:
        id: *id002
        created_at: *id001
        created_by: *id001
        type: *id002
        entity_id: *id001
        entity_type: *id002
        linked_talk_contact_id:
          type: integer
          format: int64
          minimum: 1
          description: Optional related chat contact from Events; zero/absent is omitted.
        value_before: {}
        value_after: {}
        enrichment:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ActivityEventEnrichment'
        names:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ActivityEventName'
        view:
          $ref: '#/components/schemas/ActivityEventView'
      required:
      - id
      - created_at
      - created_by
      - type
      - entity_id
      - entity_type
      - value_before
      - value_after
      additionalProperties: false
    ActivityEventEnrichment:
      type: object
      properties:
        object_kind: *id002
        object_key: *id002
        state: *id002
        reason_code: *id002
        source: *id002
        fetched_at: *id001
        payload: {}
        current: {type: boolean}
      required:
      - object_kind
      - object_key
      - state
      - source
      - current
      additionalProperties: false
      description: Current-state enrichment. Never a historical replacement for value_before/value_after.
    ActivityEventName:
      type: object
      properties:
        kind: *id002
        id: *id001
        name: *id002
        state: *id002
        current: {type: boolean}
        entity_type: *id002
      required:
      - kind
      - id
      - name
      - state
      - current
      additionalProperties: false
      description: Catalog-current label. IDs remain authoritative when the name is empty.
    ActivityEventView:
      type: object
      properties:
        category: {type: string, enum: [tasks, calls, notes, messages, status, budget, responsible, custom_fields, relations, attachments, other]}
        title: *id002
        summary: *id002
        detail_state: {type: string, enum: [omitted, available, pending, unavailable, mixed]}
        enrichment_state: *id002
        author_label: *id002
        entity_label: *id002
        details:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ActivityEventDetail'
      additionalProperties: false
      description: Product presentation. CRM texts are plain strings, never trusted HTML. Original type remains authoritative.
    ActivityEventDetail:
      type: object
      properties:
        key: *id002
        label: *id002
        before: {}
        after: {}
        text: *id002
        source: *id002
        current: {type: boolean}
      additionalProperties: false
    ActivityCategoryCount:
      type: object
      properties:
        category: *id002
        count: *id001
      required: [category, count]
      additionalProperties: false
    ActivityTimeBucket:
      type: object
      properties:
        start_at: *id001
        end_at: *id001
        count: *id001
        coverage: {type: string, enum: [unknown, partial, verified]}
      required: [start_at, end_at, count, coverage]
      additionalProperties: false
      description: Incomplete buckets keep their coverage flag. Zero is registered count, not unknown.
    ActivityQueryTotals:
      type: object
      properties:
        unique_events: *id001
        entity_count: *id001
        task_completed_events: *id001
        unique_completed_tasks: *id001
        first_event_at: *id001
        last_event_at: *id001
        category_counts:
          type: array
          items:
            $ref: '#/components/schemas/ActivityCategoryCount'
      additionalProperties: false
    ActivityUserSummary:
      type: object
      properties:
        user_id: *id001
        unique_events: *id001
        last_event_at: *id001
        first_event_at: *id001
        entity_count: *id001
        task_completed_events: *id001
        unique_completed_tasks: *id001
        category_counts:
          type: array
          items:
            $ref: '#/components/schemas/ActivityCategoryCount'
      required:
      - user_id
      - unique_events
      - last_event_at
      additionalProperties: false
      description: Count of registered unique CRM events in the requested interval, not an employee inactivity assessment.
        Last-event zero means no registered event; assess coverage first.
        first_event_at and category_counts cover the full filtered period, not the current page.
        task_completed_events counts completion events; unique_completed_tasks counts distinct task IDs.
    ActivityData:
      type: object
      properties:
        read_version:
          type: integer
          minimum: 2
          description: 2 certifies filters/order/compact. 3 certifies category filters, unknown authors and time buckets.
        payloads_omitted:
          type: boolean
          description: True for compact projection. Null payloads then do not describe the original source values.
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ActivityEvent'
        summaries:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ActivityUserSummary'
        next_cursor: *id002
        status:
          $ref: '#/components/schemas/ActivitySyncStatus'
        totals:
          $ref: '#/components/schemas/ActivityQueryTotals'
        timeline:
          type: array
          maxItems: 48
          items:
            $ref: '#/components/schemas/ActivityTimeBucket'
      required:
      - events
      - summaries
      - status
      additionalProperties: false
    ActivityUser:
      type: object
      properties:
        id: *id001
        name: *id002
        group_id: *id001
        group_name: *id002
      required:
      - id
      - name
      - group_id
      - group_name
      additionalProperties: false
    ActivityPanel:
      type: object
      properties:
        users:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ActivityUser'
        timezone: *id002
        data:
          $ref: '#/components/schemas/ActivityData'
        settings:
          $ref: '#/components/schemas/ActivitySettings'
        coverage:
          type: string
          enum:
          - unknown
          - partial
          - stale
          - verified
          description: Selected-period verification. Collector lag no longer turns a verified completed range into stale.
        freshness:
          type: string
          enum: [current, lagging, error, reauth_required]
        empty_reason:
          type: string
          enum: [no_events, unverified_empty]
        interpretation_version:
          type: integer
          minimum: 1
      required:
      - users
      - timezone
      - data
      - settings
      - coverage
      additionalProperties: false
      description: Coverage is the selected period. Freshness is collector lag or error. A verified empty period is
        no_events, not employee inactivity. Employee metadata is a bounded Gateway batch; no event history is fetched
        live when opening the panel.
    ActivityOwnerOperation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        command_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - accepted
          - running
          - retry
          - succeeded
          - failed
          - paused
        error_code: *id002
        processed: *id001
        inserted: *id001
        updated: *id001
        deduplicated: *id001
      required:
      - id
      - command_id
      - state
      - processed
      - inserted
      - updated
      - deduplicated
      additionalProperties: false
    ActivityReceipt:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - pending_delivery
          - accepted
          - running
          - retry
          - succeeded
          - failed
          - paused
        delivery_state:
          type: string
          enum:
          - pending_delivery
          - accepted
          - failed
        error_code: *id002
        operation:
          $ref: '#/components/schemas/ActivityOwnerOperation'
      required:
      - command_id
      - operation_id
      - state
      - delivery_state
      additionalProperties: false
      description: 202 proves only the Core receipt/outbox transaction committed. Poll operation_id for delivery and
        receiver lifecycle. Owner status unavailable retains accepted and supplies an error_code. Receipts/inbox are
        retained indefinitely in v0; a fresh widget JWT and same Idempotency-Key returns the same command, changed body
        conflicts.
    ErrorText:
      type: string
      description: Stable generic message without internal details or secrets.
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
      additionalProperties: false
    InstallationResult:
      type: object
      required: [installation_id, account_id, status]
      properties:
        installation_id:
          type: string
          format: uuid
        account_id:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum: [active]
      additionalProperties: false
    WidgetBootstrap:
      type: object
      required: [installation_id, account_id, user_id, client_uuid]
      properties:
        installation_id:
          type: string
          format: uuid
        account_id:
          type: integer
          format: int64
          minimum: 1
        user_id:
          type: integer
          format: int64
          minimum: 1
        client_uuid:
          type: string
          format: uuid
      additionalProperties: false
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]
      additionalProperties: false
    LeadSetStatusCommand:
      type: object
      required: [lead_id, pipeline_id, status_id]
      properties:
        lead_id:
          type: integer
          format: int64
          minimum: 1
        pipeline_id:
          type: integer
          format: int64
          minimum: 1
        status_id:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false
    LeadStatusResult:
      type: object
      required: [lead_id, pipeline_id, status_id, converged]
      properties:
        lead_id:
          type: integer
          format: int64
          minimum: 1
        pipeline_id:
          type: integer
          format: int64
          minimum: 1
        status_id:
          type: integer
          format: int64
          minimum: 1
        converged:
          type: boolean
          const: true
      additionalProperties: false
    LeadStatusRuleCommand:
      type: object
      required:
        - source_pipeline_id
        - source_status_id
        - target_pipeline_id
        - target_status_id
        - enabled
        - expected_revision
      properties:
        source_pipeline_id:
          type: integer
          format: int64
          minimum: 1
        source_status_id:
          type: integer
          format: int64
          minimum: 1
        target_pipeline_id:
          type: integer
          format: int64
          minimum: 1
        target_status_id:
          type: integer
          format: int64
          minimum: 1
        enabled:
          type: boolean
        expected_revision:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false
    LeadStatusRuleResult:
      type: object
      required:
        - rule_id
        - source_pipeline_id
        - source_status_id
        - target_pipeline_id
        - target_status_id
        - enabled
        - revision
      properties:
        rule_id:
          type: string
          format: uuid
        source_pipeline_id:
          type: integer
          format: int64
          minimum: 1
        source_status_id:
          type: integer
          format: int64
          minimum: 1
        target_pipeline_id:
          type: integer
          format: int64
          minimum: 1
        target_status_id:
          type: integer
          format: int64
          minimum: 1
        enabled:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false
    PingResult:
      type: object
      required: [pong]
      properties:
        pong:
          type: boolean
          const: true
      additionalProperties: false
    JobStatus:
      type: object
      required:
        - job_id
        - type
        - status
        - attempts
        - max_attempts
        - created_at
        - updated_at
      properties:
        job_id:
          type: string
          format: uuid
        type:
          type: string
          minLength: 1
        status:
          type: string
          enum: [queued, processing, retry, completed, failed, dead, cancelled]
        attempts:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        result:
          oneOf:
            - $ref: '#/components/schemas/PingResult'
            - $ref: '#/components/schemas/LeadStatusResult'
            - $ref: '#/components/schemas/LeadStatusRuleResult'
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
          additionalProperties: false
      additionalProperties: false
  responses:
    WidgetRateLimited:
      description: >-
        The verified integration or installation exhausted its per-process request
        budget, or the bounded limiter cache is full. No JWT replay record,
        idempotency key, or job is consumed by this rejection. Retry after the
        indicated delay; the same JWT may be reused while it remains valid.
      headers:
        Retry-After:
          description: Minimum suggested retry delay in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code]
                properties:
                  code:
                    type: string
                    enum: [rate_limited]
    ServiceNotEnabled:
      description: The lead-status capability is not enabled for this integration.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code]
                properties:
                  code:
                    type: string
                    enum: [service_not_enabled]
    OAuthError:
      description: >-
        OAuth start or callback rejected. Start uses HTTP 400 invalid_argument
        for missing integration codes and other start failures so existence is
        not revealed. Callback uses 400 invalid_argument for client/state errors.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    OAuthRateLimited:
      description: >-
        Process-local OAuth start/callback budget exhausted. JWT/account lookup
        is not performed. The JSON body is identical for known and unknown
        integration codes and does not include account details.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Retry-After:
          description: Minimum suggested retry delay in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    OAuthUnavailable:
      description: amoCRM OAuth exchange or account lookup failed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    BadRequest:
      description: Request parameters or body are invalid.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/ErrorText'
    Unauthorized:
      description: >-
        Widget JWT is missing, ambiguous, malformed, expired or already used.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        WWW-Authenticate:
          description: Authentication challenge.
          schema:
            type: string
            const: Bearer
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/ErrorText'
    NotFound:
      description: Secret route, tenant-scoped resource or identifier was not found.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/ErrorText'
    PayloadTooLarge:
      description: Request body exceeds the configured byte limit.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/ErrorText'
    UnsupportedMediaType:
      description: Webhook body is not form-urlencoded.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/ErrorText'
    InternalServerError:
      description: Authentication storage or another internal dependency failed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/ErrorText'
    BadGateway:
      description: amoCRM OAuth exchange or account lookup failed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/ErrorText'
    ServiceUnavailable:
      description: A durable database operation could not be completed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/ErrorText'
