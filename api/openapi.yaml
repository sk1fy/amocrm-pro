      security:
      - widgetToken: []
      - widgetBearer: []
      parameters:
      - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySyncStatus'
        '400':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '401':
          description: Authentication failed or disposable JWT already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '403':
          description: Activity capability, installation pilot or current server-confirmed admin role denied, or installation requires reauthorization (`reauth_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '404':
          description: Actor-scoped operation not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '409':
          description: The same key has different content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '429':
          description: Ingress or bounded downstream capacity exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '503':
          description: Policy, Gateway or owner unavailable; no false success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '504':
          description: Bounded RPC deadline elapsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
  /api/v1/widget/activity/settings:
    get:
      tags:
      - Widget
      operationId: getActivitySettings
      summary: Read product settings.
      description: Requires an active installation, explicit Activity capability and pilot, and a server-confirmed
        amoCRM admin. No frontend role claim is trusted. Existing widget JWT/CORS/ingress limits apply; middleware
        errors may use the existing text/plain authentication contract.
      security:
      - widgetToken: []
      - widgetBearer: []
      parameters:
