openapi: 3.1.0
info:
  title: amoCRM Go backend API
  version: 0.1.0
  summary: HTTP contract for the amoCRM integration foundation.
  description: |
    Current public contract implemented by `cmd/api`.

    Webhook bodies and widget responses can contain tenant data. Do not put
    production payloads, bearer tokens, OAuth codes, webhook keys or PII into
    logs, examples, Issues or traces.
servers:
  - url: /
tags:
  - name: System
  - name: OAuth
  - name: Webhook
  - name: Widget
paths:
  /live:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Check process liveness.
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: The API process is alive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /oauth/amocrm/start:
    get:
      tags: [OAuth]
      operationId: startAmoCRMOAuth
      summary: Create one-time OAuth state and redirect to amoCRM.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: integration_code
          in: query
          required: true
          description: Active integration code configured by the operator.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: return_url
          in: query
          required: false
          description: Optional absolute-path reference on this service.
          schema:
            type: string
            pattern: '^/'
            maxLength: 1024
      responses:
        '302':
          description: Redirect to the amoCRM authorization page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Location:
              description: amoCRM authorization URL with a one-time state.
              required: true
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/OAuthError'
        '429':
          $ref: '#/components/responses/OAuthRateLimited'
  /oauth/amocrm/callback:
    get:
      tags: [OAuth]
      operationId: completeAmoCRMOAuth
      summary: Consume OAuth state and create or update an installation.
      description: |
        `code` and `referer` are required for a successful callback. When
        amoCRM returns `error`, the state is consumed and the request fails.
        State is one-time and cannot be replayed.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: code
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: referer
          in: query
          required: false
          description: HTTPS amoCRM/Kommo account domain used by the callback.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: error
          in: query
          required: false
          description: Authorization denial code returned by amoCRM.
          schema:
            type: string
            maxLength: 128
      responses:
        '201':
          description: Installation and encrypted credentials were persisted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationResult'
        '400':
          $ref: '#/components/responses/OAuthError'
        '429':
          $ref: '#/components/responses/OAuthRateLimited'
        '502':
          $ref: '#/components/responses/OAuthUnavailable'
  /hooks/amocrm/v1/{webhookKey}:
    post:
      tags: [Webhook]
      operationId: receiveAmoCRMWebhook
      summary: Durably accept an amoCRM webhook delivery.
      description: |
        The path key is a secret credential. A `204` means the delivery or its
        invalid-payload audit record was committed to PostgreSQL. Business
        processing remains asynchronous and at-least-once.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: webhookKey
          in: path
          required: true
          description: Secret installation webhook key; never log or expose it.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: amoCRM nested form keys plus `account[id]`.
              properties:
                account[id]:
                  type: integer
                  format: int64
                  minimum: 1
              additionalProperties: true
      responses:
        '204':
          description: Delivery was durably accepted; response has no body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          description: Global or per-installation process-local limit exceeded.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Retry-After:
              description: Suggested retry delay in seconds.
              schema:
                type: integer
                minimum: 0
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorText'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/widget/bootstrap:
    get:
      tags: [Widget]
      operationId: getWidgetBootstrap
      summary: Resolve the authenticated widget tenant and user.
      description: Every request requires a fresh, disposable amoCRM JWT.
      security:
        - widgetToken: []
        - widgetBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Authenticated widget principal.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetBootstrap'
        '429':
          $ref: '#/components/responses/WidgetRateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/widget/actions/ping:
    post:
      tags: [Widget]
      operationId: enqueueWidgetPing
      summary: Enqueue the infrastructure widget-to-worker proof action.
      description: >-
        Every attempt requires a fresh disposable amoCRM JWT. Retrying an
        uncertain request with the same Idempotency-Key returns the original
        accepted job and does not enqueue a duplicate.
      security:
        - widgetToken: []
        - widgetBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Ping job was durably enqueued.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Idempotency-Replayed:
              description: Present and true when the stored acceptance response was replayed.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '429':
          $ref: '#/components/responses/WidgetRateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The idempotency key is already bound to another request or is still processing.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorText'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/widget/actions/leads/set-status:
    post:
      tags: [Widget]
      operationId: enqueueWidgetLeadSetStatus
      summary: Enqueue an admin-only workflow that converges a lead to a pipeline status.
      description: >-
        Requires the lead-status service capability for this integration.
        Capability is checked before token/idempotency consumption and again
        in the worker before mutation.
        The worker re-checks the verified actor as an active amoCRM administrator,
        reads the lead, and only sends PATCH when the requested pipeline/status
        differs. A retry after an uncertain PATCH compares remote state first.
      security:
        - widgetToken: []
        - widgetBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadSetStatusCommand'
      responses:
        '202':
          description: Lead status workflow was durably admitted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Idempotency-Replayed:
              description: Present and true when the stored acceptance response was replayed.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/WidgetRateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ServiceNotEnabled'
        '409':
          description: The idempotency key is bound to a different command or is still processing.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorText'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/widget/workflow-rules/lead-status/configure:
    post:
      tags: [Widget]
      operationId: configureWidgetLeadStatusRule
      summary: Asynchronously create, update, or disable one lead-status workflow rule.
      description: >-
        Requires the lead-status service capability for this integration.
        Capability is checked before token/idempotency consumption and again
        in the worker before mutation.
        The disposable JWT identifies the durable widget user actor but does not
        grant administrative authority. The worker re-checks that actor as an
        active amoCRM administrator immediately before applying revision CAS.
        expected_revision zero creates revision one; positive values update only
        the exact current revision. CAS failures are reported through job status.
      security:
        - widgetToken: []
        - widgetBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadStatusRuleCommand'
      responses:
        '202':
          description: Rule configuration command was durably admitted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Idempotency-Replayed:
              description: Present and true when the stored acceptance response was replayed.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/WidgetRateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ServiceNotEnabled'
        '409':
          description: The idempotency key is bound to a different command or is still processing.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorText'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/widget/jobs/{jobID}:
    get:
      tags: [Widget]
      operationId: getWidgetJob
      summary: Read an asynchronous job scoped to the widget installation.
      description: Every request requires a fresh, disposable amoCRM JWT.
      security:
        - widgetToken: []
        - widgetBearer: []
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: jobID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant-scoped job status.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '429':
          $ref: '#/components/responses/WidgetRateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/widget/activity/events/{eventID}:
    get:
      tags: [Widget]
      operationId: getActivityEvent
      summary: Read one retained CRM event with full before/after payloads.
      description: >-
        Uses the same active installation, Activity capability, pilot, current administrator and fresh JWT checks.
        The lookup is scoped to the authenticated installation; no client tenant or account is accepted.
        Missing, expired and foreign event IDs return not_found. Paused collection retains access to history.
        No direct amoCRM request or fallback list scan is performed. Requires an updated CRM Events detail reader.
        Optional enrichment and names are current-state sidecar data and do not replace value_before/value_after.
      security:
      - widgetToken: []
      - widgetBearer: []
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - name: eventID
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$'}
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityEvent'
        '400':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '401':
          description: Authentication failed or disposable JWT already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '403':
          description: Activity capability, installation pilot or current server-confirmed admin role denied, or installation requires reauthorization (`reauth_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '404':
          description: Retained event not found in the authenticated installation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '409':
          description: The same key has different content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '429':
          description: Ingress or bounded downstream capacity exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '503':
          description: Policy, Gateway or owner unavailable; no false success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '504':
          description: Bounded RPC deadline elapsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
  /api/v1/widget/activity/panel:
    get:
      tags:
      - Widget
      operationId: getActivityPanel
      summary: Read a bounded CRM observation panel.
      description: Requires an active installation, explicit Activity capability and pilot, and a server-confirmed
        amoCRM admin. No frontend role claim is trusted. Existing widget JWT/CORS/ingress limits apply; middleware
        errors may use the existing text/plain authentication contract. Summaries cover the full filtered period.
        Extended options or any cursor require read_version 2 end to end; older services fail unavailable instead of ignoring filters.
        Category filters, unknown-author inclusion and time buckets require read_version 3.
        Cursors bind scope and normalized filters, including order/compact, but not page size.
        Legacy or incompatible cursors are rejected; restart at the first page. Pagination is not a snapshot.
        Coverage describes the selected period; freshness is collector lag/error and does not mark a verified completed day incomplete.
      security:
      - widgetToken: []
      - widgetBearer: []
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - name: from
        in: query
        required: true
        schema: &id001
          type: integer
          format: int64
          minimum: 0
        description: Unix seconds. The entire period is bounded to 31 days.
      - name: to
        in: query
        required: true
        schema: *id001
        description: Unix seconds. The entire period is bounded to 31 days.
      - name: user_ids
        in: query
        schema:
          type: string
        description: Comma-separated distinct positive employee IDs; at most 100. Empty selects a bounded directory
          batch.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 512
        description: Opaque cursor for the same filters and period.
      - name: types
        in: query
        style: form
        explode: false
        schema:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$'}
        description: Exact types, combined with type_prefix using OR.
      - name: type_prefix
        in: query
        schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_.:-]+$'}
        description: Literal prefix such as task_ or custom_field_; no wildcard syntax.
      - name: entity_type
        in: query
        schema: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_.:-]+$'}
      - name: entity_ids
        in: query
        style: form
        explode: false
        schema:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: integer, format: int64, minimum: 1}
        description: Requires entity_type; combined with period, users and type filters using AND.
      - name: order
        in: query
        schema: {type: string, enum: [asc, desc], default: asc}
        description: Stable created_at and event ID ordering.
      - name: compact
        in: query
        schema: {type: boolean, default: false}
        description: Omit both payloads from the page as null and set data.payloads_omitted=true. Detail returns full values.
      - name: categories
        in: query
        style: form
        explode: false
        schema:
          type: array
          maxItems: 11
          uniqueItems: true
          items: {type: string, enum: [tasks, calls, notes, messages, status, budget, responsible, custom_fields, relations, attachments, other]}
        description: Product families applied to the page and whole-period summaries. Combined with types/prefix using AND.
      - name: include_unknown_authors
        in: query
        schema: {type: boolean, default: false}
        description: Include created_by=0 and authors absent from the current directory. Default panel sets this when no user_ids are supplied.
      - name: buckets
        in: query
        schema: {type: string, enum: [hour, day, auto, none]}
        description: Optional time distribution in the account timezone. Hour is limited to 48 buckets.
      - name: group_id
        in: query
        schema: {type: integer, format: int64, minimum: 1}
        description: Current directory group. Historical membership is not promised. Resolved to employee IDs before the event owner query.
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPanel'
        '400':
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '401':
          description: Authentication failed or disposable JWT already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '403':
          description: Activity capability, installation pilot or current server-confirmed admin role denied, or installation requires reauthorization (`reauth_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '404':
          description: Actor-scoped operation not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '409':
          description: The same key has different content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '429':
          description: Ingress or bounded downstream capacity exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '503':
          description: Policy, Gateway or owner unavailable; no false success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
        '504':
          description: Bounded RPC deadline elapsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityError'
