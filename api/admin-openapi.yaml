openapi: 3.1.0
info:
  title: amoCRM Core admin API
  version: v1
  summary: Internal admin read and command listener.
  description: |
    Internal Core admin contract. This is not the public widget/OAuth API.
    Authenticate with `Authorization: Bearer` using `ADMIN_API_TOKEN` and send
    `X-Admin-Actor`. Responses never include OAuth tokens, ciphertext, webhook
    keys, or job payload/result.
    The public Compose development token is rejected outside APP_ENV=development.
servers:
  - url: /
security:
  - adminBearer: []
tags:
  - name: Admin
paths:
  /admin/v1/backend:
    get:
      tags: [Admin]
      operationId: getAdminBackend
      summary: Core identity, revision and component catalog.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
      responses:
        '200':
          description: Backend observation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/accounts:
    get:
      tags: [Admin]
      operationId: listAdminAccounts
      summary: Accounts aggregated from installations.
      parameters:
        - name: verification
          in: query
          schema: {type: string, enum: [ok, stale, unknown, failed]}
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - name: q
          in: query
          schema: {type: string}
        - name: integration_id
          in: query
          schema: {type: string, format: uuid}
        - name: status
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Account list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/accounts/{account_id}:
    get:
      tags: [Admin]
      operationId: getAdminAccount
      summary: Account with all installations.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - name: account_id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Account card.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/installations:
    get:
      tags: [Admin]
      operationId: listAdminInstallations
      summary: Installation list.
      parameters:
        - name: verification
          in: query
          schema: {type: string, enum: [ok, stale, unknown, failed]}
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - name: account_id
          in: query
          schema: {type: integer, format: int64, minimum: 1}
        - name: domain
          in: query
          schema: {type: string}
        - name: integration_id
          in: query
          schema: {type: string, format: uuid}
        - name: status
          in: query
          schema: {type: string}
        - name: webhook_status
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Installation list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationListResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/installations/{id}:
    get:
      tags: [Admin]
      operationId: getAdminInstallation
      summary: Installation card with authorization and webhook facts.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Installation card.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/installations/{id}/jobs:
    get:
      tags: [Admin]
      operationId: listAdminInstallationJobs
      summary: Jobs for one installation without payload or result.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
        - name: status
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Job list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/installations/{id}/audit:
    get:
      tags: [Admin]
      operationId: listAdminInstallationAudit
      summary: Audit log for one installation.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/installations/{id}/activity/deliveries:
    get:
      tags: [Admin]
      operationId: listAdminInstallationDeliveries
      summary: Most recent Activity command deliveries for one installation.
      description: Ordered by receipt created_at descending, then command_id descending.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
      responses:
        '200':
          description: Delivery list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveriesResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/installations/{id}/activity/settings:
    get:
      tags: [Admin]
      operationId: getAdminActivitySettings
      summary: Activity collection settings for one installation.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Settings observation. updated_at 0 means defaults were never saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivitySettingsResponse'}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/v1/installations/{id}/activity/status:
    get:
      tags: [Admin]
      operationId: getAdminActivityStatus
      summary: CRM Events sync status. not_enabled is a 200 data state.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Sync status observation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityStatusResponse'}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/v1/installations/{id}/activity/operations/{operation_id}:
    get:
      tags: [Admin]
      operationId: getAdminActivityOperation
      summary: Activity or CRM Events operation for the installation.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
        - name: operation_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Operation observation without tokens.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityOperationResponse'}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/v1/installations/{id}/activity/panels:
    get:
      tags: [Admin]
      operationId: listAdminActivityPanels
      summary: Managed Activity panels without view_key or share_url.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Panel list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListResponse'}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/v1/installations/{id}/activity/panels/{panel_id}:
    get:
      tags: [Admin]
      operationId: getAdminActivityPanel
      summary: One managed panel without view_key or share_url.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
        - name: panel_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Panel observation.
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/v1/installations/{id}/activity/employees:
    get:
      tags: [Admin]
      operationId: listAdminActivityEmployees
      summary: Directory of employees for panel management.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Employee directory.
          content:
            application/json:
              schema: {type: object}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/BackendUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/v1/installations/{id}/lead-status/rules:
    get:
      tags: [Admin]
      operationId: listAdminLeadStatusRules
      summary: Lead-status workflow rules for one installation.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Rule list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListResponse'}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/v1/installations/{id}/lead-status/runs:
    get:
      tags: [Admin]
      operationId: listAdminLeadStatusRuns
      summary: Lead-status workflow runs and latest effect state.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Run list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListResponse'}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/v1/stats:
    get:
      tags: [Admin]
      operationId: getAdminStats
      summary: Platform stats for a 24h, 7d or 30d period.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - name: period
          in: query
          schema: {type: string, enum: [24h, 7d, 30d], default: 7d}
      responses:
        '200':
          description: Stats snapshot. Unknown values are null, zero is a real count.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatsResponse'}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/v1/stats/accounts:
    get:
      tags: [Admin]
      operationId: listAdminStatsAccounts
      summary: Account rows for one stats metric. Total matches the summary count.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - name: metric
          in: query
          required: true
          schema: {type: string, enum: [auth_problems, sync_problems, connected, disconnected, active]}
        - name: period
          in: query
          schema: {type: string, enum: [24h, 7d, 30d], default: 7d}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Account list for the metric.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListResponse'}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/v1/integrations:
    get:
      tags: [Admin]
      operationId: listAdminIntegrations
      summary: Integrations with grants and installation counts.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Integration list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/integrations/{id}:
    get:
      tags: [Admin]
      operationId: getAdminIntegration
      summary: Integration card.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Integration card.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/jobs:
    get:
      tags: [Admin]
      operationId: listAdminJobs
      summary: Jobs across installations. Window is at most 7 days.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - name: status
          in: query
          schema: {type: string}
        - name: type
          in: query
          schema: {type: string}
        - name: since
          in: query
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Job list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/jobs/summary:
    get:
      tags: [Admin]
      operationId: getAdminJobsSummary
      summary: Job counts grouped by status.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
      responses:
        '200':
          description: Job counts.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/jobs/{id}:
    get:
      tags: [Admin]
      operationId: getAdminJob
      summary: Job with attempts. Payload and result are omitted.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Job card.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/audit:
    get:
      tags: [Admin]
      operationId: listAdminAudit
      summary: Audit log by object or installation.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - name: object_type
          in: query
          schema: {type: string}
        - name: object_id
          in: query
          schema: {type: string}
        - name: action
          in: query
          schema: {type: string}
        - name: installation_id
          in: query
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit list.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/v1/commands:
    post:
      tags: [Admin]
      operationId: executeAdminCommand
      summary: Execute or enqueue a durable idempotent admin command.
      description: |
        Idempotency keys are global across actors. A UUID key is the receipt ID;
        other keys map to UUIDv5 in the OID namespace. Changed requests conflict.
        Secrets are accepted only for integration create/rotate-secret and are
        never persisted in command receipts, jobs, logs, or responses.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '200':
          description: Terminal receipt, including a replay.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        '202':
          description: Pending worker command.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /admin/v1/commands/{id}:
    get:
      tags: [Admin]
      operationId: getAdminCommand
      summary: Read a durable receipt without retrying its command.
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - $ref: '#/components/parameters/AdminActor'
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Receipt with its latest persisted safe result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommandReceipt'}
        '400': {$ref: '#/components/responses/InvalidArgument'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: Shared ADMIN_API_TOKEN for the internal admin listener.
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional UUID correlation ID. Invalid values are replaced.
      schema:
        type: string
        format: uuid
    AdminActor:
      name: X-Admin-Actor
      in: header
      required: true
      description: Actor for logs, such as employee:<uuid> or automation:<name>.
      schema:
        type: string
        minLength: 3
        maxLength: 200
    ResourceID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
  headers:
    RequestID:
      description: UUID correlation ID accepted or generated by the API.
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CommandRequest:
      type: object
      additionalProperties: false
      required: [target_type, target_id, command, payload]
      properties:
        target_type: {type: string, enum: [installation, integration, job, delivery]}
        target_id:
          type: string
          description: UUID, or new for integration create.
        command:
          type: string
          enum: [create, update, rotate-secret, enable, disable, set-service, revoke, uninstall, reconcile, check, pilot-enable, pilot-disable, retry, activity-configure, activity-sync, activity-panel-create, activity-panel-patch, activity-panel-rotate, lead-status-configure]
        payload:
          type: object
          additionalProperties: false
          properties:
            installation_id: {type: string, format: uuid, description: Required owner assertion for delivery retry.}
            code: {type: string}
            client_id: {type: string, format: uuid}
            client_secret: {type: string, writeOnly: true, minLength: 1, maxLength: 16384}
            redirect_uri: {type: string, format: uri}
            webhook_events: {type: array, items: {type: string}}
            services: {type: array, items: {type: string}}
            service: {type: string, enum: [lead-status, activity]}
            enabled: {type: boolean}
            initial_days: {type: integer}
            retention_days: {type: integer}
            expected_updated_at: {type: integer, format: int64}
            kind: {type: string, enum: [enable, sync, backfill, disable]}
            from: {type: integer, format: int64}
            to: {type: integer, format: int64}
            name: {type: string}
            employee_ids: {type: array, items: {type: integer, format: int64}}
            display_window:
              type: object
              properties:
                from: {type: string}
                to: {type: string}
            panel_id: {type: string, format: uuid}
            revision: {type: integer, format: int64}
            source_pipeline_id: {type: integer, format: int64}
            source_status_id: {type: integer, format: int64}
            target_pipeline_id: {type: integer, format: int64}
            target_status_id: {type: integer, format: int64}
            expected_revision: {type: integer, format: int64}
    CommandReceipt:
      type: object
      required: [id, target_type, target_id, command, state, result, observed_at, created_at]
      properties:
        id: {type: string, format: uuid}
        target_type: {type: string}
        target_id: {type: string}
        command: {type: string}
        state: {type: string, enum: [accepted, pending, running, succeeded, failed, partial, unknown_outcome]}
        outcome: {type: string}
        result:
          type: object
          description: Safe result only. Check has classification, verification, observed_at and retry_after seconds; uninstall may have webhook_error.
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
        observed_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        job_id: {type: string, format: uuid}
    AdminError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          additionalProperties: false
          properties:
            code:
              type: string
              enum: [unauthenticated, invalid_argument, not_found, conflict, permission_denied, backend_unavailable, internal]
            message:
              type: string
              minLength: 1
            request_id:
              type: string
            retryable:
              type: boolean
    ListResponse:
      type: object
      required: [source, observed_at, items, next_cursor, total]
      properties:
        source: {type: string, const: core}
        observed_at: {type: string, format: date-time}
        items: {type: array, items: {type: object}}
        next_cursor:
          type: [string, 'null']
        total:
          type: [integer, 'null']
    BackendResponse:
      type: object
      required: [source, observed_at, backend, revision, contract_version, capabilities, components]
      properties:
        source: {type: string, const: core}
        observed_at: {type: string, format: date-time}
        backend: {type: string, const: core}
        revision: {type: string}
        contract_version: {type: string, const: v1}
        capabilities:
          type: array
          items: {type: string}
        components: {}
    Grant:
      type: object
      required: [service, enabled]
      properties:
        service: {type: string}
        enabled: {type: boolean}
    RecentFailedJobs:
      type: integer
      minimum: 0
      description: Number of failed or dead jobs whose updated_at is within the last 24 hours.
    AccountInstallation:
      type: object
      required: [id, integration_id, integration_code, status, recent_failed_jobs, grants]
      properties:
        authorization_check:
          $ref: '#/components/schemas/AuthorizationCheck'
        id: {type: string, format: uuid}
        integration_id: {type: string, format: uuid}
        integration_code: {type: string}
        status: {type: string}
        webhook_status: {type: string}
        authorization_state: {type: string}
        recent_failed_jobs:
          $ref: '#/components/schemas/RecentFailedJobs'
        grants:
          type: array
          description: Integration service grants; an empty array means no grants exist.
          items:
            $ref: '#/components/schemas/Grant'
    AccountListResponse:
      allOf:
        - $ref: '#/components/schemas/ListResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                required: [account_id, installations]
                properties:
                  account_id: {type: integer, format: int64}
                  installations:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountInstallation'
    InstallationSummary:
      type: object
      required: [id, integration_id, integration_code, account_id, account_domain, status, installed_by, origin, created_at, updated_at, recent_failed_jobs]
      properties:
        authorization_check:
          $ref: '#/components/schemas/AuthorizationCheck'
        id: {type: string, format: uuid}
        integration_id: {type: string, format: uuid}
        integration_code: {type: string}
        account_id: {type: integer, format: int64}
        account_domain: {type: string}
        status: {type: string}
        installed_by: {type: [integer, 'null'], format: int64}
        origin: {type: string, enum: [real, fixture]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        webhook_status: {type: string}
        recent_failed_jobs:
          $ref: '#/components/schemas/RecentFailedJobs'
    InstallationListResponse:
      allOf:
        - $ref: '#/components/schemas/ListResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/InstallationSummary'
    InstallationCard:
      type: object
      required: [installation, authorization, webhook, grants, activity]
      properties:
        installation:
          $ref: '#/components/schemas/InstallationSummary'
        authorization: {type: object}
        webhook: {type: object}
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        activity: {type: object}
    AccountResponse:
      type: object
      required: [source, observed_at, account_id, domains, origin, installations]
      properties:
        source: {type: string, const: core}
        observed_at: {type: string, format: date-time}
        account_id: {type: integer, format: int64}
        domains:
          type: array
          items: {type: string}
        origin: {type: string, enum: [real, fixture]}
        installations:
          type: array
          items:
            $ref: '#/components/schemas/InstallationCard'
    InstallationResponse:
      type: object
      required: [source, observed_at, installation, authorization, webhook, grants, activity]
      properties:
        source: {type: string, const: core}
        observed_at: {type: string, format: date-time}
        installation:
          $ref: '#/components/schemas/InstallationSummary'
        authorization: {type: object}
        webhook: {type: object}
        grants:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        activity: {type: object}
    IntegrationResponse:
      type: object
      required: [source, observed_at, integration]
      properties:
        source: {type: string, const: core}
        observed_at: {type: string, format: date-time}
        integration: {type: object}
    Job:
      type: object
      required: [id, type, status, retry_allowed]
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        status: {type: string}
        retry_allowed: {type: boolean}
        retry_reason: {type: string, enum: [unsupported_type, not_failed, target_inactive, attempt_limit]}
    JobListResponse:
      allOf:
        - {$ref: '#/components/schemas/ListResponse'}
        - type: object
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/Job'}}
    JobResponse:
      type: object
      required: [source, observed_at, job, attempts]
      properties:
        source: {type: string, const: core}
        observed_at: {type: string, format: date-time}
        job: {$ref: '#/components/schemas/Job'}
        attempts:
          type: array
          items: {type: object}
    JobsSummaryResponse:
      type: object
      required: [source, observed_at, counts]
      properties:
        source: {type: string, const: core}
        observed_at: {type: string, format: date-time}
        counts:
          type: object
          additionalProperties: {type: integer}
    DeliveriesResponse:
      type: object
      required: [source, observed_at, items]
      properties:
        source: {type: string, const: core}
        observed_at: {type: string, format: date-time}
        items:
          type: array
          items: {type: object}
    ActivitySettingsResponse:
      type: object
      required: [source, observed_at, initial_days, retention_days, updated_at]
      properties:
        source: {type: string, const: core}
        observed_at: {type: string, format: date-time}
        initial_days: {type: integer}
        retention_days: {type: integer}
        updated_at: {type: integer, format: int64}
    ActivityStatusResponse:
      type: object
      required: [source, observed_at, enabled, state, verification, lag_seconds, reauth_required]
      properties:
        source: {type: string, const: core}
        observed_at: {type: string, format: date-time}
        enabled: {type: boolean}
        state: {type: string}
        verification: {type: string}
        lag_seconds: {type: integer, format: int64}
        reauth_required: {type: boolean}
        error_code: {type: string}
        last_success_at: {type: [string, 'null'], format: date-time}
        last_event_at: {type: [string, 'null'], format: date-time}
        verified_from: {type: [string, 'null'], format: date-time}
        verified_through: {type: [string, 'null'], format: date-time}
    ActivityOperationResponse:
      type: object
      required: [source, observed_at, command_id, operation_id, state, delivery_state]
      properties:
        source: {type: string, const: core}
        observed_at: {type: string, format: date-time}
        command_id: {type: string}
        operation_id: {type: string}
        state: {type: string}
        delivery_state: {type: string}
        error_code: {type: string}
    StatsResponse:
      type: object
      required: [source, observed_at, period, connections, period_events, active_accounts, job_errors, latency, queues, auth_problems_count, sync_problems_count]
      properties:
        verification:
          type: object
          properties:
            unverified: {type: integer}
            temporary_errors: {type: integer}
            verified: {type: integer}
        source: {type: string, const: core}
        observed_at: {type: string, format: date-time}
        period: {type: string}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        connections: {type: array, items: {type: object}}
        period_events: {type: object}
        active_accounts: {type: [integer, 'null']}
        job_errors: {type: [integer, 'null']}
        latency: {type: object}
        queues: {type: array, items: {type: object}}
        auth_problems_count: {type: [integer, 'null']}
        sync_problems_count: {type: [integer, 'null']}
    AuthorizationCheck:
      type: object
      description: Optional on older Core versions. Server freshness is 90 minutes; active is installation lifecycle, not live access.
      required: [classification, observed_at, freshness, fresh_for_seconds]
      properties:
        classification: {type: string, enum: [verified_ok, auth_error, network_error, rate_limited, internal_error, unknown]}
        observed_at: {type: [string, 'null'], format: date-time}
        freshness: {type: string, enum: [fresh, stale, unknown, unavailable]}
        fresh_for_seconds: {type: integer, enum: [5400]}
        retry_after: {type: integer, minimum: 0}
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string, description: Safe fixed message; never upstream body.}


  responses:
    Conflict:
      description: Changed idempotent request or another command in flight for the target.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminError'}
    Unauthenticated:
      description: Missing or invalid bearer token or actor.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        WWW-Authenticate:
          description: Authentication challenge.
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
    InvalidArgument:
      description: Request parameters are invalid.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
    NotFound:
      description: The requested resource was not found.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
    InternalError:
      description: Internal error without SQL, DSN or secret details.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
    PermissionDenied:
      description: Pilot, capability or role denied the observation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminError'}
    BackendUnavailable:
      description: Activity or CRM Events adapter is unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AdminError'}
