syntax = "proto3";

package amocrm.platform.v1;
option go_package = "github.com/sk1fy/amocrm-pro/internal/servicerpc/platformpb";

import "google/protobuf/timestamp.proto";

// Only the Platform service identity may read the Core-owned snapshot.
// Core policy checks the installation scope carried by auth on every call.
service CoreInstallations {
  rpc GetSnapshot(GetSnapshotRequest) returns (InstallationSnapshot);
}

message GetSnapshotRequest {
  string auth = 1; // Short-lived Core delegation for platform_installations/snapshot.
  string core_installation_id = 2;
}

enum Authorization {
  AUTHORIZATION_UNSPECIFIED = 0;
  AUTHORIZATION_AUTHORIZED = 1;
  AUTHORIZATION_REAUTH_REQUIRED = 2;
  AUTHORIZATION_DISABLED = 3;
  AUTHORIZATION_UNKNOWN = 4;
}

message InstallationSnapshot {
  string core_installation_id = 1;
  string integration_id = 2;
  int64 amo_account_id = 3;
  optional string current_domain = 4;
  Authorization authorization = 5;
  int64 observed_at_unix = 6;
  // Legacy rows can lack a known lifecycle. Both fields are present or absent.
  optional uint64 generation = 7;
  optional uint64 sequence = 8;
  optional uint64 authorization_sequence = 9;
}

service CoreAccountObservations {
  rpc ObserveAccount(ObserveAccountRequest) returns (AccountObservation);
}

enum AccountObservationComponent {
  ACCOUNT_OBSERVATION_COMPONENT_UNSPECIFIED = 0;
  ACCOUNT_OBSERVATION_COMPONENT_LICENSE = 1;
  ACCOUNT_OBSERVATION_COMPONENT_USERS = 2;
}

message ObserveAccountRequest {
  int64 amo_account_id = 1;
  string core_installation_id = 2;
  string integration_id = 3;
  uint64 generation = 4;
  uint64 authorization_sequence = 5;
  AccountObservationComponent component = 6;
  bool observation_only = 7;
}

message AccountObservation {
  google.protobuf.Timestamp observed_at = 1;
  oneof result {
    AccountIdentity identity = 2;
    CRMUserRoster roster = 3;
    AccountPaymentRequired payment_required = 4;
  }
}

// The authorized account identity endpoint replied with HTTP 402.
message AccountPaymentRequired {}

message AccountIdentity {
  string current_domain = 1;
  string display_name = 2;
  optional string time_zone = 3;
  map<string,string> widget_versions = 4; // Core installation UUID to observed amoCRM version.
}

message CRMUserRoster {
  repeated ObservedCRMUser users = 1;
}

message ObservedCRMUser {
  int64 id = 1;
  string name = 2;
  bool is_active = 3;
  bool is_admin = 4;
}

service CoreAccountDirectory {
  rpc ListInstallations(AccountDirectoryRequest) returns (AccountDirectoryPage);
}
message AccountDirectoryRequest {
  int64 amo_account_id = 1;
  string after_installation_id = 2;
}
message AccountDirectoryEntry {
  string installation_id = 1;
  string integration_id = 2;
  string product_code = 3;
  string authorization = 4;
  bool current = 5;
  bool observation_only = 6;
  google.protobuf.Timestamp registered_at = 7;
  int64 lifecycle_sequence = 8;
}
message AccountDirectoryPage {
  repeated AccountDirectoryEntry entries = 1;
  string next_cursor = 2;
}
