name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate OpenAPI contract
        uses: docker/build-push-action@v6
        with:
          context: .
          target: openapi-test
          push: false
          cache-from: type=gha,scope=openapi
          cache-to: type=gha,mode=max,scope=openapi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.activity.yml config --quiet
          docker compose -f docker-compose.activity.yml -f docker-compose.activity-embedded.yml config --quiet
          docker compose -p activity-config-check --profile tests -f docker-compose.activity.yml -f docker-compose.activity-tests.yml config --quiet

      - name: Run formatting checks, vet, and tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha,scope=tests
          cache-to: type=gha,mode=max,scope=tests

  build:
    name: Build ${{ matrix.target }} image
    needs:
      - contract
      - test
      - integration
      - activity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - api
          - worker
          - migrate
          - integrations
          - activity
          - crm-events
          - service-certs
          - activity-control
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  integration:
    name: PostgreSQL integration
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate integration Compose configuration
        run: docker compose -f docker-compose.test.yml config --quiet

      - name: Run isolated migrations and integration tests
        run: make COMPOSE="docker compose" integration-test

  activity:
    name: Activity owner databases, RPC, processes and UI
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run isolated Activity verification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/activity-v0-evidence
          make COMPOSE="docker compose" activity-ci 2>&1 | tee tmp/activity-v0-evidence/activity-compose.log

      - name: Upload Activity verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-verification
          path: tmp/activity-v0-evidence/
          if-no-files-found: warn
