        '500':
          $ref: '#/components/responses/Failure'
components:
  securitySchemes:
    serviceIdentity:
      type: mutualTLS
      description: Разрешённая identity Core или company; SAN/ACL проверяются.
    delegation:
      type: http
      scheme: bearer
      description: 'Короткая signed delegation: issuer/audience/action/scope; не пользовательский
        JWT и не OAuth.'
    widgetJwt:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Disposable amoCRM JWT; exact issuer/audience/client/account/user, replay, capability;
        actor/company не из browser body.
    adminBearer:
      type: http
      scheme: bearer
      description: Internal Core admin credential; browser never receives it. Admin API enforces
        employee RBAC and passes X-Admin-Actor.
  schemas:
    Id:
      type: string
      format: uuid
    CrmId:
      type: string
      pattern: ^[1-9][0-9]*$
      maxLength: 19
      description: Положительный CRM ID как decimal string; без float-конверсии и ведущих нулей.
        Semantic bound <=9223372036854775807 обязателен в приложении и fixtures; regex не доказывает
        upper bound.
    Revision:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: Safe JSON integer; proto uint64/DB bigint обязаны проверять тот же диапазон.
    Timestamp:
      type: string
      format: date-time
      description: RFC3339 UTC с Z; время наблюдения не равно времени факта источника.
    OperationState:
      type: string
      enum:
      - queued
      - prechecking
      - applying
      - outcome_unknown
      - confirming
      - succeeded
      - no_change
      - rejected
      - cancelled
      - conflict
    ExternalEffectState:
      type: string
      enum:
      - no_attempt
      - in_flight
      - unknown
      - settled
    OperationOutcome:
      type: string
      enum:
      - assigned
      - kept
      - already_target
      - source_changed
      - cancelled
      - rejected
      - conflict
    ErrorCode:
      type: string
      enum:
      - decision_expired
      - recipient_unavailable
      - validation_failed
      - unauthenticated
      - permission_denied
      - resource_not_found
      - binding_not_active
      - binding_mismatch
      - mapping_required
      - capability_revoked
      - unsupported_algorithm
      - stage_already_owned
      - revision_conflict
      - idempotency_conflict
      - operation_unresolved
      - invalid_transition
      - cursor_invalid
      - cursor_expired
      - source_unavailable
      - policy_unavailable
      - reauth_required
      - rate_limited
      - internal_error
      - distribution_rule_managed
    Reason:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 1000
        retryable:
          type: boolean
        nextAttemptAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - code
      - message
      - retryable
      additionalProperties: false
    Scope:
      type: object
      properties:
        companyId:
          $ref: '#/components/schemas/Id'
        accountId:
          $ref: '#/components/schemas/CrmId'
        integrationId:
          $ref: '#/components/schemas/Id'
        installationId:
          $ref: '#/components/schemas/Id'
        bindingId:
          $ref: '#/components/schemas/Id'
        bindingRevision:
          $ref: '#/components/schemas/Revision'
      required:
      - companyId
      - accountId
      - integrationId
      - installationId
      - bindingId
      - bindingRevision
      additionalProperties: false
    LeadSnapshot:
      type: object
      properties:
        leadId:
          $ref: '#/components/schemas/CrmId'
        pipelineId:
          $ref: '#/components/schemas/CrmId'
        statusId:
          $ref: '#/components/schemas/CrmId'
        responsibleUserId:
          anyOf:
          - $ref: '#/components/schemas/CrmId'
          - type: 'null'
        sourceUpdatedAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        observedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
      - leadId
      - pipelineId
      - statusId
      - responsibleUserId
      - observedAt
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              minLength: 1
              maxLength: 1000
            status:
              type: integer
              minimum: 400
              maximum: 599
            code:
              $ref: '#/components/schemas/ErrorCode'
            requestId:
              $ref: '#/components/schemas/Id'
            details:
              type: object
              properties:
                field:
                  type: string
                  maxLength: 120
                currentRevision:
                  $ref: '#/components/schemas/Revision'
                operationId:
                  $ref: '#/components/schemas/Id'
                retryAfterSeconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
              required: []
              additionalProperties: false
          required:
          - message
          - status
          - code
          - requestId
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Actor:
      type: object
      properties:
        kind:
          type: string
          enum:
          - user
          - system
          - operator
        teamosUserId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        crmUserId:
          anyOf:
          - $ref: '#/components/schemas/CrmId'
          - type: 'null'
        operatorId:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - kind
      additionalProperties: false
      description: Actor из проверенного server context; не доверять значению browser payload.
      allOf:
      - if:
          properties:
            kind:
              const: user
        then:
          required:
          - teamosUserId
          - crmUserId
          properties:
            teamosUserId:
              $ref: '#/components/schemas/Id'
            crmUserId:
              $ref: '#/components/schemas/CrmId'
      - if:
          properties:
            kind:
              const: operator
        then:
          required:
          - operatorId
          properties:
            operatorId:
              $ref: '#/components/schemas/Id'
    EventEnvelope:
      type: object
      properties:
        schemaVersion: &id001
          type: integer
          const: 1
        messageId: &id002
          $ref: '#/components/schemas/Id'
        scope: &id003
          $ref: '#/components/schemas/Scope'
        eventId: &id004
          $ref: '#/components/schemas/Id'
        sourceEventId: &id005
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
        sourceOccurredAt: &id006
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        receivedAt: &id007
          $ref: '#/components/schemas/Timestamp'
        emittedAt: &id008
          $ref: '#/components/schemas/Timestamp'
        correlationId: &id009
          $ref: '#/components/schemas/Id'
        causationId: &id010
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        event:
          type: object
          properties:
            kind:
              type: string
              enum:
              - lead.created
              - lead.status_changed
              - lead.responsible_changed
              - lead.deleted
            leadId:
              $ref: '#/components/schemas/CrmId'
            entryFingerprint:
              anyOf:
              - type: string
                minLength: 1
                maxLength: 255
              - type: 'null'
            before:
              anyOf:
              - $ref: '#/components/schemas/LeadSnapshot'
              - type: 'null'
            after:
              anyOf:
              - $ref: '#/components/schemas/LeadSnapshot'
              - type: 'null'
          required:
          - kind
          - leadId
          - entryFingerprint
          - before
          - after
          additionalProperties: false
      required:
      - schemaVersion
      - messageId
      - scope
      - eventId
      - sourceEventId
      - sourceOccurredAt
      - receivedAt
      - emittedAt
      - correlationId
      - causationId
      - event
      additionalProperties: false
    AssignmentEnvelope:
      type: object
      properties:
        schemaVersion: *id001
        messageId: *id002
        scope: *id003
        eventId: *id004
        sourceEventId: *id005
        sourceOccurredAt: *id006
        receivedAt: *id007
        emittedAt: *id008
        correlationId: *id009
        causationId: *id010
        command:
          type: object
          properties:
            operationId:
              $ref: '#/components/schemas/Id'
            episodeId:
              $ref: '#/components/schemas/Id'
            decisionId:
              $ref: '#/components/schemas/Id'
            ruleId:
              $ref: '#/components/schemas/Id'
            ruleRevision:
              $ref: '#/components/schemas/Revision'
            decisionKind:
              type: string
              enum:
              - assign
              - keep
            targetResponsibleUserId:
              $ref: '#/components/schemas/CrmId'
            expectedSnapshot:
              $ref: '#/components/schemas/LeadSnapshot'
            actor:
              $ref: '#/components/schemas/Actor'
            validUntil:
              $ref: '#/components/schemas/Timestamp'
            groupId: &id011
              $ref: '#/components/schemas/Id'
            availabilityRevision: &id012
              $ref: '#/components/schemas/Revision'
            claimRevision: &id013
              $ref: '#/components/schemas/Revision'
          required:
          - operationId
          - episodeId
          - decisionId
          - ruleId
          - ruleRevision
          - decisionKind
          - targetResponsibleUserId
          - expectedSnapshot
          - actor
          - validUntil
          - groupId
          - availabilityRevision
          - claimRevision
          additionalProperties: false
          description: keep никогда не делает PATCH; target должен совпасть с expectedSnapshot.responsibleUserId.
            При несовпадении source возвращается source_changed.
      required:
      - schemaVersion
      - messageId
      - scope
      - eventId
      - sourceEventId
      - sourceOccurredAt
      - receivedAt
      - emittedAt
      - correlationId
      - causationId
      - command
      additionalProperties: false
      description: System actor действует по binding/rule, user по свежим user checks. operationId
        постоянен при retry. validUntil ограничивает admission/precheck, но не доказывает отсутствие
        уже отправленного PATCH.
    OperationError:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 1000
        retryable:
          type: boolean
        terminal:
          type: boolean
        retryAfterSeconds:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 86400
          - type: 'null'
      required:
      - code
      - message
      - retryable
      - terminal
      - retryAfterSeconds
      additionalProperties: false
    ResolutionEvidence:
      type: object
      properties:
        kind:
          type: string
          enum:
          - no_request_sent
          - response_and_observation
          - observed_state_only
          - operator_reconciliation
        observedAt:
          $ref: '#/components/schemas/Timestamp'
        guardReleasable:
          type: boolean
        explanation:
          type: string
          maxLength: 1000
      required:
      - kind
      - observedAt
      - guardReleasable
      - explanation
      additionalProperties: false
      description: observed_state_only не снимает late-PATCH uncertainty. settled+outcome описывают
        результат раздельно; claim release требует evidence.
      allOf:
      - if:
          properties:
            kind:
              const: observed_state_only
        then:
          properties:
            guardReleasable:
              const: false
    Operation:
      type: object
      properties:
        operationId:
          $ref: '#/components/schemas/Id'
        scope:
          $ref: '#/components/schemas/Scope'
        episodeId:
          $ref: '#/components/schemas/Id'
        decisionId:
          $ref: '#/components/schemas/Id'
        ruleId:
          $ref: '#/components/schemas/Id'
        ruleRevision:
          $ref: '#/components/schemas/Revision'
        eventId:
          $ref: '#/components/schemas/Id'
        correlationId:
          $ref: '#/components/schemas/Id'
        state:
          $ref: '#/components/schemas/OperationState'
        externalEffectState:
          $ref: '#/components/schemas/ExternalEffectState'
        outcome:
          anyOf:
          - $ref: '#/components/schemas/OperationOutcome'
          - type: 'null'
        resultVersion:
          $ref: '#/components/schemas/Revision'
        confirmedSnapshot:
          anyOf:
          - $ref: '#/components/schemas/LeadSnapshot'
          - type: 'null'
        resolutionEvidence:
          anyOf:
          - $ref: '#/components/schemas/ResolutionEvidence'
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/OperationError'
          - type: 'null'
        acceptedAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        groupId: *id011
        availabilityRevision: *id012
        claimRevision: *id013
        cancelRequestedAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        targetResponsibleUserId:
          $ref: '#/components/schemas/CrmId'
      required:
      - operationId
      - scope
      - episodeId
      - decisionId
      - ruleId
      - ruleRevision
      - eventId
      - correlationId
      - state
      - externalEffectState
      - outcome
      - resultVersion
      - confirmedSnapshot
      - resolutionEvidence
      - error
      - acceptedAt
      - updatedAt
      - groupId
      - availabilityRevision
      - claimRevision
      - targetResponsibleUserId
      additionalProperties: false
      description: 'succeeded/no_change требуют confirmedSnapshot. no_change+kept не расходует round-robin;
        no_change+already_target расходует. Терминальные состояния запрещены при unknown/in_flight:
        тогда сохраняется outcome_unknown/confirming и cancelRequested, guard удерживается.'
      allOf:
      - if:
          properties:
            state:
              const: succeeded
        then:
          properties:
            externalEffectState:
              const: settled
            outcome:
              const: assigned
            confirmedSnapshot:
              $ref: '#/components/schemas/LeadSnapshot'
            resolutionEvidence:
              $ref: '#/components/schemas/ResolutionEvidence'
      - if:
          properties:
            state:
              const: no_change
        then:
          properties:
            externalEffectState:
              enum:
              - no_attempt
              - settled
            outcome:
              enum:
              - kept
              - already_target
            confirmedSnapshot:
              $ref: '#/components/schemas/LeadSnapshot'
            resolutionEvidence:
              $ref: '#/components/schemas/ResolutionEvidence'
      - if:
          properties:
            state:
              const: outcome_unknown
        then:
          properties:
            externalEffectState:
              const: unknown
      - if:
          properties:
            externalEffectState:
              enum:
              - in_flight
              - unknown
        then:
          properties:
            resolutionEvidence:
              anyOf:
              - allOf:
                - $ref: '#/components/schemas/ResolutionEvidence'
                - properties:
                    guardReleasable:
                      const: false
              - type: 'null'
      - if:
          properties:
            state:
              enum:
              - rejected
              - cancelled
              - conflict
        then:
          properties:
            externalEffectState:
              enum:
              - no_attempt
              - settled
            resolutionEvidence:
              $ref: '#/components/schemas/ResolutionEvidence'
            outcome:
              enum:
              - source_changed
              - cancelled
              - rejected
              - conflict
      - if:
          properties:
            state:
              enum:
              - succeeded
              - no_change
              - rejected
              - cancelled
              - conflict
        then:
          properties:
            resolutionEvidence:
              allOf:
              - $ref: '#/components/schemas/ResolutionEvidence'
              - properties:
                  guardReleasable:
                    const: true
                  kind:
                    enum:
                    - no_request_sent
                    - response_and_observation
                    - operator_reconciliation
      - if:
          properties:
            state:
              const: succeeded
        then:
          properties:
            resolutionEvidence:
              properties:
                kind:
                  enum:
                  - response_and_observation
                  - operator_reconciliation
      - if:
          properties:
            state:
              const: no_change
        then:
          properties:
            resolutionEvidence:
              properties:
                kind:
                  const: no_request_sent
    ResultEnvelope:
