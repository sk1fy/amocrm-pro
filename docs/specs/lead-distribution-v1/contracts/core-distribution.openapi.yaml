        episodeId:
          $ref: '#/components/schemas/Id'
        ruleId:
          $ref: '#/components/schemas/Id'
        ruleRevision:
          $ref: '#/components/schemas/Revision'
        availabilityRevision:
          $ref: '#/components/schemas/Revision'
        claimRevision:
