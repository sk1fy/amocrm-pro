          $ref: '#/components/schemas/Id'
        operationId:
          $ref: '#/components/schemas/Id'
        workerFence:
          $ref: '#/components/schemas/Revision'
        checkedAt:
          $ref: '#/components/schemas/Timestamp'
        validUntil:
          $ref: '#/components/schemas/Timestamp'
        reason:
          anyOf:
          - $ref: '#/components/schemas/Reason'
          - type: 'null'
      required:
      - allowed
      - decisionId
      - operationId
      - workerFence
      - checkedAt
      - validUntil
      - reason
      additionalProperties: false
      description: Fresh single-attempt policy snapshot valid <=5 seconds; no persistent/cross-request
        cache. allowed=false for paused/cancelled/stale revisions/inactive mapping. Failure=503.
        Not a remote transaction lock; change after approval marks cancellation_requested for in-flight
        operation.
    CancelOperationInput:
      type: object
      properties:
        expectedResultVersion:
          $ref: '#/components/schemas/Revision'
        actor:
          $ref: '#/components/schemas/Actor'
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - expectedResultVersion
      - actor
      - requestedAt
      - reason
      additionalProperties: false
      description: Запрос отмены сохраняется до ACK. no_attempt можно завершить cancelled; после
        possible PATCH только cancellation_requested, исход сверяется. Старый immutable scope разрешает
        cleanup после binding revoke, но не новое назначение.
