openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Core / TeamOS lead distribution — proposed bridge API
  version: 0.1.0-proposed
  description: Проект РС-02. Не смонтирован в runtime. Перед реализацией переносится в canonical
    OpenAPI/protobuf владельца; текущие URL и контракты не изменены.
x-contract-status: proposed
servers:
- url: https://distribution.example.invalid
security:
- serviceIdentity: []
  delegation: []
paths:
  /internal/v1/distribution/events:
    post:
      operationId: distributionAcceptEvent
      summary: 'Core → TeamOS: durable вход события'
      x-authorization: Core delivery identity; signed scope/bindingRevision; independent consumer
        dedup
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Принято после durable commit; ещё не выполнено. Повтор key+payload возвращает
            тот же receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryReceipt'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
    x-receiver: teamos-company
  /internal/v1/distribution/results:
    post:
      operationId: distributionAcceptResult
      summary: 'Core → TeamOS: push результата'
      x-authorization: Core result identity; operation scope + monotonically increasing resultVersion
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Принято после durable commit; ещё не выполнено. Повтор key+payload возвращает
            тот же receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryReceipt'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultEnvelope'
    x-receiver: teamos-company
  /internal/v1/distribution/bindings/confirm:
    post:
      operationId: distributionConfirmBinding
      summary: 'Core → TeamOS: подтвердить intent'
      x-authorization: Core verified live CRM admin context + valid TeamOS owner/admin link intent
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Принято после durable commit; ещё не выполнено. Повтор key+payload возвращает
