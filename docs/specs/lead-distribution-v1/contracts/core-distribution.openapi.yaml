      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingConfirmation'
    x-receiver: teamos-company
  /internal/v1/distribution/assignments:
    post:
      operationId: distributionAcceptAssignment
      summary: 'TeamOS → Core: принять назначение'
      x-authorization: TeamOS distribution principal; exact binding/capability/lead scope and fresh
        policy
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Принято после durable commit; ещё не выполнено. Повтор key+payload возвращает
