      description: 'Безопасная ошибка: message/status/code/requestId. HTTP status совпадает с error.status.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        Retry-After:
          description: Только для 429/503 с известной задержкой; секунды.
          schema:
            type: integer
            minimum: 0
    AdminFailure:
      description: Core admin error; без секретов, с retryable и request_id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminError'
