    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Повтор после timeout использует тот же ключ и payload; lookup namespace — stable
        bindingId+action; public requests дополнительно actor; revision/installation в immutable
        payload hash.
  responses:
