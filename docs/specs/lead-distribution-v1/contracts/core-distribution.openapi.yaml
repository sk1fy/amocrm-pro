          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentEnvelope'
    x-receiver: amocrm-core
  /internal/v1/distribution/assignments/expire:
    post:
      operationId: distributionExpireAssignment
      summary: Зафиксировать отсутствие исполнения истёкшей команды
      description: >-
        Принимает исходный неизменённый AssignmentEnvelope и Idempotency-Key.
        Под общими блокировками admission возвращает существующую операцию,
        включая неизвестный исход, без изменений. Если операции нет и validUntil
        истёк по часам Core DB, атомарно сохраняет rejected/no_attempt с
        no_request_sent, terminal receipt и result outbox. Связанный job сразу
        cancelled; исполнимый job, guard и CRM PATCH не создаются. Поздний POST
        assignments получает тот же terminal receipt. Историческая binding
        проверяется полностью; pause/revoked capability не мешают завершению.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentEnvelope'
      responses:
        '200':
          description: Сохранённая операция; только terminal evidence разрешает освобождение защиты.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          description: invalid_transition до срока; idempotency_conflict при изменении intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/Failure'
      security:
      - distributionSignature: []
    x-receiver: amocrm-core
    x-route-owner: worker
  /internal/v1/distribution/operations/{operationId}:
    parameters:
    - name: operationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    get:
      operationId: distributionGetOperation
      summary: 'TeamOS → Core: восстановить результат'
      x-authorization: Exact service principal+company/account/installation/binding scope; no cross-actor
        result disclosure
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
