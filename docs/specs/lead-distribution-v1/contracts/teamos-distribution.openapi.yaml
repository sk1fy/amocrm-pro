openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: TeamOS lead distribution — proposed additive API
  version: 0.1.0-proposed
  description: Проект РС-02. Не смонтирован в runtime. Перед реализацией переносится в canonical
    OpenAPI/protobuf владельца; текущие URL и контракты не изменены.
x-contract-status: proposed
servers:
- url: https://distribution.example.invalid
security:
- bearerAuth: []
paths:
  /api/v1/distribution/connections:
    get:
      operationId: distributionListConnections
      summary: Подключения текущей компании
      x-authorization: distribution:view
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - &id001
        $ref: '#/components/parameters/Cursor'
      - &id002
        $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionPage'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
  /api/v1/distribution/connections/{bindingId}:
    parameters:
    - name: bindingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    get:
      operationId: distributionGetConnection
      summary: Состояние подключения
      x-authorization: distribution:view
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
  /api/v1/distribution/connections/link-intents:
    post:
      operationId: distributionCreateLinkIntent
      summary: Инициировать подтверждение связи
      x-authorization: TeamOS owner/admin; company из verified session; CRM-side confirmation отдельно
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkIntent'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkIntentInput'
  /api/v1/distribution/references/users:
    get:
      operationId: distributionListUsers
      summary: Сотрудники, сопоставление и доступность
      x-authorization: distribution:view
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - *id001
      - *id002
      - name: bindingId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserReferencePage'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
  /api/v1/distribution/references/pipelines:
    get:
      operationId: distributionListPipelines
      summary: Воронки и этапы
      x-authorization: distribution:view
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - *id001
      - *id002
      - name: bindingId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineReferencePage'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
  /api/v1/distribution/groups/overview:
    get:
      operationId: distributionListGroupOverview
      summary: Новая пагинируемая проекция групп
      x-authorization: distribution:view
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - *id001
      - *id002
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupOverviewPage'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
  /api/v1/distribution/rules:
    get:
      operationId: distributionListRules
      summary: Правила компании
      x-authorization: distribution:view
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - *id001
      - *id002
      - name: groupId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      - name: bindingId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePage'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
    post:
      operationId: distributionCreateRule
      summary: Создать правило первой версии
      x-authorization: TeamOS owner/admin; all group/member/binding IDs in current company
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleInput'
  /api/v1/distribution/rules/{ruleId}:
    parameters:
    - name: ruleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    get:
      operationId: distributionGetRule
      summary: Получить актуальную конфигурацию
      x-authorization: distribution:view
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
    put:
      operationId: distributionReplaceRule
      summary: Сохранить правило с CAS
      x-authorization: TeamOS owner/admin; expectedRevision CAS; unsupported legacy algorithm rejected
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRuleInput'
  /api/v1/distribution/rules/{ruleId}/commands:
    parameters:
    - name: ruleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    post:
      operationId: distributionCommandRule
      summary: Пауза, возобновление или пересчёт
      x-authorization: TeamOS owner/admin; expectedRevision checked at admission and execution
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Принято после durable commit; ещё не выполнено. Повтор key+payload возвращает
            тот же receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCommandInput'
  /api/v1/distribution/queue:
    get:
      operationId: distributionListQueue
      summary: Очередь разрешённых сделок
      x-authorization: TeamOS section distribution or owner/admin AND CanViewLead per row; scoped
        counts/cursor
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - *id001
      - *id002
      - name: groupId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      - name: ruleId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      - name: bindingId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      - name: leadId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CrmId'
      - name: state
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/QueueState'
          maxItems: 13
          uniqueItems: true
      - name: from
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: to
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - receivedAt.asc
          - receivedAt.desc
          default: receivedAt.asc
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuePage'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
  /api/v1/distribution/queue/{episodeId}:
    parameters:
    - name: episodeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    get:
      operationId: distributionGetEpisode
      summary: Детали сделки и первые 100 событий истории
      x-authorization: CanViewLead on resolved episode; no cross-tenant existence disclosure
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueDetails'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
  /api/v1/distribution/queue/{episodeId}/commands:
    parameters:
    - name: episodeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    post:
      operationId: distributionCommandEpisode
      summary: Отмена, сверка или безопасный повтор
      x-authorization: TeamOS owner/admin AND CanViewLead; expectedRevision and current effect state
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Принято после durable commit; ещё не выполнено. Повтор key+payload возвращает
            тот же receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpisodeCommandInput'
  /api/v1/distribution/history:
    get:
      operationId: distributionListHistory
      summary: История разрешённых решений
      x-authorization: CanViewLead for each associated episode
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - *id001
      - *id002
      - name: episodeId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      - name: groupId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      - name: from
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: to
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
  /api/v1/distribution/stats:
    get:
      operationId: distributionGetStats
      summary: Показатели по подтверждённым решениям
      x-authorization: Same resource visibility as queue; range <=31 days and timezone from company
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: groupId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Id'
      - name: from
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Timestamp'
      - name: to
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Timestamp'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
  /api/v1/distribution/commands/{commandId}:
    parameters:
    - name: commandId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    get:
      operationId: distributionGetCommand
      summary: Восстановить результат после timeout
      x-authorization: Original actor + company scope; episode commands additionally CanViewLead;
        other actors need explicit operator diagnostics permission
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '404':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '429':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
        '500':
          $ref: '#/components/responses/Failure'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: TeamOS access JWT
  schemas:
    Id:
      type: string
      format: uuid
    CrmId:
      type: string
      pattern: ^[1-9][0-9]*$
      maxLength: 19
      description: Положительный CRM ID как decimal string; без float-конверсии и ведущих нулей.
        Semantic bound <=9223372036854775807 обязателен в приложении и fixtures; regex не доказывает
        upper bound.
    Revision:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: Safe JSON integer; proto uint64/DB bigint обязаны проверять тот же диапазон.
    Timestamp:
      type: string
      format: date-time
      description: RFC3339 UTC с Z; время наблюдения не равно времени факта источника.
    QueueState:
      type: string
      enum:
      - checking
      - waiting_shift
      - needs_configuration
      - paused
      - waiting_previous_operation
      - assigning
      - outcome_unknown
      - assigned
      - kept
      - unchanged
      - cancelled
      - error
    OperationState:
      type: string
      enum:
      - queued
      - prechecking
      - applying
      - outcome_unknown
      - confirming
      - succeeded
      - no_change
      - rejected
      - cancelled
      - conflict
    ExternalEffectState:
      type: string
      enum:
      - no_attempt
      - in_flight
      - unknown
      - settled
    OperationOutcome:
      type: string
      enum:
      - assigned
      - kept
      - already_target
      - source_changed
      - cancelled
      - rejected
      - conflict
    ErrorCode:
      type: string
      enum:
      - validation_failed
      - unauthenticated
      - permission_denied
      - resource_not_found
      - binding_not_active
      - binding_mismatch
      - mapping_required
      - capability_revoked
      - unsupported_algorithm
      - stage_already_owned
      - revision_conflict
      - idempotency_conflict
      - operation_unresolved
      - invalid_transition
      - cursor_invalid
      - cursor_expired
      - source_unavailable
      - policy_unavailable
      - reauth_required
      - rate_limited
      - internal_error
      - distribution_rule_managed
    Freshness:
      type: string
      enum:
      - fresh
      - stale
      - unknown
      - unavailable
    Reason:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 1000
        retryable:
          type: boolean
        nextAttemptAt:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - code
      - message
      - retryable
      additionalProperties: false
    Scope:
      type: object
      properties:
        companyId:
          $ref: '#/components/schemas/Id'
        accountId:
          $ref: '#/components/schemas/CrmId'
        integrationId:
          $ref: '#/components/schemas/Id'
        installationId:
          $ref: '#/components/schemas/Id'
        bindingId:
          $ref: '#/components/schemas/Id'
        bindingRevision:
          $ref: '#/components/schemas/Revision'
      required:
      - companyId
      - accountId
