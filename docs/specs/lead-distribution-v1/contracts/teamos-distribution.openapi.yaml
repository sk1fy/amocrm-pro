    Rule:
      type: object
      properties:
        groupId: &id003
          $ref: '#/components/schemas/Id'
        bindingId: &id004
          $ref: '#/components/schemas/Id'
        pipelineId: &id005
          $ref: '#/components/schemas/CrmId'
        statusId: &id006
          $ref: '#/components/schemas/CrmId'
        algorithm: &id007
          type: string
          enum:
          - round_robin
        timezone: &id008
          type: string
          minLength: 1
          maxLength: 64
          description: Проверенный IANA timezone.
        keepCurrentAvailableResponsible: &id009
          type: boolean
          default: true
        enabled: &id010
          type: boolean
        memberIds: &id011
          type: array
          items:
            $ref: '#/components/schemas/Id'
          minItems: 1
          maxItems: 1000
          uniqueItems: true
        disabledMemberIds: &id012
          type: array
          items:
            $ref: '#/components/schemas/Id'
          maxItems: 1000
          uniqueItems: true
        ruleId:
          $ref: '#/components/schemas/Id'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        allowedActions:
          $ref: '#/components/schemas/PermissionSet'
        state:
          type: string
          enum:
          - draft
          - active
          - paused
          - archived
      required:
      - groupId
      - bindingId
      - pipelineId
      - statusId
      - algorithm
      - timezone
      - keepCurrentAvailableResponsible
      - enabled
      - memberIds
      - disabledMemberIds
      - ruleId
      - revision
      - createdAt
      - updatedAt
      - allowedActions
      - state
      additionalProperties: false
      description: enabled является (state == active); archived не изменяется. memberIds возвращают
        текущую версию snapshot атомарно с rule revision.
    CreateRuleInput:
      type: object
      properties:
        groupId: *id003
        bindingId: *id004
        pipelineId: *id005
        statusId: *id006
        algorithm: *id007
        timezone: *id008
        keepCurrentAvailableResponsible: *id009
        enabled: *id010
        memberIds: *id011
        disabledMemberIds: *id012
        expectedGroupUpdatedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
      - groupId
      - bindingId
      - pipelineId
      - statusId
      - algorithm
      - timezone
      - keepCurrentAvailableResponsible
      - enabled
      - memberIds
      - disabledMemberIds
      - expectedGroupUpdatedAt
      additionalProperties: false
      description: Группа существует в компании. Участники сохраняются атомарно с rule revision;
        external mapping проверяется. Создание enabled rule с legacy algorithm != round_robin отклоняется,
        silent fallback запрещён. expectedGroupUpdatedAt получен из GroupOverview.groupUpdatedAt.
        После подключения rule старые PATCH/DELETE этой группы получают distribution_rule_managed;
        несвязанные legacy группы не меняются.
    UpdateRuleInput:
      type: object
      properties:
        groupId: *id003
        bindingId: *id004
        pipelineId: *id005
        statusId: *id006
        algorithm: *id007
        timezone: *id008
        keepCurrentAvailableResponsible: *id009
        enabled: *id010
        memberIds: *id011
        disabledMemberIds: *id012
        expectedRevision:
          $ref: '#/components/schemas/Revision'
      required:
      - groupId
      - bindingId
      - pipelineId
      - statusId
      - algorithm
      - timezone
      - keepCurrentAvailableResponsible
      - enabled
      - memberIds
      - disabledMemberIds
      - expectedRevision
      additionalProperties: false
      description: Полная замена конфигурации; CAS+idempotency. Членство группы и revision изменяются
        в одной owner-транзакции. archived rule отклоняется; enabled=false переводит в paused, не
        удаляет очередь; source tuple меняется только после сверки операций старого scope.
