  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/Id'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Повтор после timeout использует тот же ключ и payload; lookup namespace — stable
        bindingId+action+actor; revision/installation в immutable payload hash, не новый namespace.
  responses:
    Failure:
      description: 'Безопасная ошибка: message/status/code/requestId. HTTP status совпадает с error.status.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        Retry-After:
          description: Только для 429/503 с известной задержкой; секунды.
          schema:
            type: integer
            minimum: 0
