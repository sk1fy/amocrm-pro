# TEMPLATE — private Core<->TeamOS distribution bridge (TLS terminator).
#
# Render with envsubst:
#   DISTRIBUTION_DOMAIN=... TLS_LIVE_DIR=... \
#   TEAMOS_BRIDGE_GATEWAY=... CORE_BRIDGE_GATEWAY=... \
#   TEAMOS_BRIDGE_NET=... CORE_BRIDGE_NET=... PUBLIC_IP=... \
#     envsubst '${DISTRIBUTION_DOMAIN} ${TLS_LIVE_DIR} ${TEAMOS_BRIDGE_GATEWAY} ${CORE_BRIDGE_GATEWAY} ${TEAMOS_BRIDGE_NET} ${CORE_BRIDGE_NET} ${PUBLIC_IP}' \
#     < nginx-distribution-bridge.conf > /etc/nginx/sites-available/distribution-bridge
#
# Listeners bind ONLY to the docker bridge gateway of the client network, so the
# counterpart container can reach the host proxy while nothing is exposed on a
# public interface. A valid Let's Encrypt certificate for the distribution
# domain is reused; containers map that hostname to their own bridge gateway via
# extra_hosts, so Go TLS verification succeeds.
#
#   ${TEAMOS_BRIDGE_GATEWAY}:8443  TeamOS company -> Core worker private listener (127.0.0.1:18084)
#   ${CORE_BRIDGE_GATEWAY}:8444    Core worker    -> Team company private callback (127.0.0.1:18081)

server {
    listen ${TEAMOS_BRIDGE_GATEWAY}:8443 ssl;
    server_name ${DISTRIBUTION_DOMAIN};

    ssl_certificate     ${TLS_LIVE_DIR}/${DISTRIBUTION_DOMAIN}/fullchain.pem;
    ssl_certificate_key ${TLS_LIVE_DIR}/${DISTRIBUTION_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow ${TEAMOS_BRIDGE_NET};
    allow ${PUBLIC_IP};
    deny all;
    client_max_body_size 64k;

    location /internal/v1/distribution/ {
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location = /components/distribution/ready {
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
    }
    location / { return 404; }
}

server {
    listen ${CORE_BRIDGE_GATEWAY}:8444 ssl;
    server_name ${DISTRIBUTION_DOMAIN};

    ssl_certificate     ${TLS_LIVE_DIR}/${DISTRIBUTION_DOMAIN}/fullchain.pem;
    ssl_certificate_key ${TLS_LIVE_DIR}/${DISTRIBUTION_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow ${CORE_BRIDGE_NET};
    allow ${PUBLIC_IP};
    deny all;
    client_max_body_size 64k;

    location /internal/v1/distribution/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location / { return 404; }
}
