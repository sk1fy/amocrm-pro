# TEMPLATE — public TLS entrypoint (amocrm-pro API + widget assets + widget API).
#
# Render with envsubst (nginx cannot interpolate ${...} itself):
#   DISTRIBUTION_DOMAIN=... TLS_LIVE_DIR=... \
#     envsubst '${DISTRIBUTION_DOMAIN} ${TLS_LIVE_DIR}' \
#     < nginx-amocrm.conf > /etc/nginx/sites-available/amocrm
# then enable + reload. Upstream ports and routes are preserved from staging.
#
# Security note: /widget-assets/ serves pinned static bytes; the widget API
# behind /api/v1/widget/distribution/ still requires a verified amoCRM widget
# JWT and an active integration capability.

# HTTP -> HTTPS redirect
server {
    if ($host = ${DISTRIBUTION_DOMAIN}) {
        return 301 https://$host$request_uri;
    }

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ${DISTRIBUTION_DOMAIN};

    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy to the amocrm-pro API container
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name ${DISTRIBUTION_DOMAIN};
    ssl_certificate     ${TLS_LIVE_DIR}/${DISTRIBUTION_DOMAIN}/fullchain.pem;
    ssl_certificate_key ${TLS_LIVE_DIR}/${DISTRIBUTION_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Grafana (observability) behind the same TLS domain, served from a sub-path.
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Widget distribution assets (static, pinned).
    location /widget-assets/ {
        root /var/www;
        types { application/javascript js; application/json json; image/png png; }
        add_header Cache-Control "public,max-age=31536000,immutable";
        try_files $uri =404;
    }
    location = /widget-assets/release.json {
        alias /var/www/widget-assets/release.json;
        add_header Cache-Control "no-cache";
    }

    # Widget distribution API on the existing HTTPS origin. Only the public
    # widget routes are exposed here; the private /internal/v1/ listener stays
    # bound to the docker bridge.
    location /api/v1/widget/distribution/ {
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
