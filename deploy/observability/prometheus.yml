# Local/pilot scrape config. This is not a production Alertmanager deployment.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s

rule_files:
  - alerts.yml

alerting:
  alertmanagers: []

scrape_configs:
  - job_name: activity-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8082"]
        labels:
          component: api
  - job_name: activity-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8081"]
        labels:
          component: worker
  - job_name: activity
    metrics_path: /metrics
    static_configs:
      - targets: ["activity:8091"]
        labels:
          component: activity
  - job_name: crm-events
    metrics_path: /metrics
    static_configs:
      - targets: ["crm-events:8092"]
        labels:
          component: crm-events
