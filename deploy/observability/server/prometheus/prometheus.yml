# Server scrape config. Job names match the existing pilot rules/tests
# (activity-api, activity-worker, activity, crm-events). The app management
# endpoints are reached over the amocrm-pro_backend network by Docker DNS:
#   api:8082 worker:8081 activity:8091 crm-events:8092
# Monitoring components are scraped over the observability monitoring network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s
  external_labels:
    environment: production
    host: vm2074077.vds.chsl.one

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/server-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: activity-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8082"]
        labels:
          component: api

  - job_name: activity-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8081"]
        labels:
          component: worker

  - job_name: activity
    metrics_path: /metrics
    static_configs:
      - targets: ["activity:8091"]
        labels:
          component: activity

  - job_name: crm-events
    metrics_path: /metrics
    static_configs:
      - targets: ["crm-events:8092"]
        labels:
          component: crm-events

  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: node-exporter

  - job_name: monitoring
    metrics_path: /metrics
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          component: prometheus
      - targets: ["alertmanager:9093"]
        labels:
          component: alertmanager
      - targets: ["loki:3100"]
        labels:
          component: loki
      - targets: ["alloy:12345"]
        labels:
          component: alloy

  # admin-api (amocrm-pro-admin). Reached over the dedicated internal network
  # `amocrm-admin-observability` (never published on the host).
  - job_name: admin-api
    metrics_path: /metrics
    static_configs:
      - targets: ["admin-api:8092"]
        labels:
          component: admin-api

  - job_name: grafana
    metrics_path: /grafana/metrics
    basic_auth:
      username: metrics
      password_file: /etc/prometheus/grafana-metrics-password
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          component: grafana
