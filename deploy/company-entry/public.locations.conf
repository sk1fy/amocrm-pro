# Include inside the existing HTTPS virtual host. Bind this upstream to loopback.
location = /api/v1/widget/company/status {
    proxy_pass http://127.0.0.1:18088;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /api/v1/widget/company/entries {
    access_log off;
    proxy_pass http://127.0.0.1:18088;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
