# Include ONLY INSIDE the existing private distribution-bridge TLS server block
# listening on 172.24.0.1:8443. Keep its allow/deny rules unchanged.
location /internal/v1/task-control/accounts/ {
    proxy_pass http://127.0.0.1:18087;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# CRM reference snapshots use a separate, unversioned Core route.
# Keep it in the same private TLS server with its existing network ACL and
# signed service-grant authentication; never include this in the public vhost.
location ~ ^/internal/task-control/accounts/[0-9]+/references$ {
    proxy_pass http://127.0.0.1:18087;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
