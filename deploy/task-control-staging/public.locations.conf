# Include INSIDE the existing HTTPS server block for 2-26-66-187.sslip.io.
# Core verifies amoCRM identity. Preserve the original request path.
location = /api/v1/widget/task-control/auth {
    proxy_pass http://127.0.0.1:18087;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
# Disconnect is verified by Core; the remaining routes go straight to TeamOS.
location = /api/v1/widget/task-control/disconnect {
    # The signed query is a reusable credential: do not log it.
    access_log off;
    proxy_pass http://127.0.0.1:18087;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /api/v1/widget/task-control/sessions {
    proxy_pass http://127.0.0.1:8180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /api/v1/widget/task-control/bootstrap {
    proxy_pass http://127.0.0.1:8180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /api/v1/widget/task-control/connection {
    proxy_pass http://127.0.0.1:8180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /api/v1/widget/task-control/source-requests {
    proxy_pass http://127.0.0.1:8180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
# The UUID expression is quoted because nginx treats braces as block syntax.
location ~ "^/api/v1/widget/task-control/source-requests/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/result$" {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /api/v2/task-control/runtime/bootstrap {
    proxy_pass http://127.0.0.1:8180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /api/v2/task-control/runtime/ack {
    proxy_pass http://127.0.0.1:8180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /api/v1/task-control/runtime/ack {
    proxy_pass http://127.0.0.1:8180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location = /api/v1/task-control/runtime/telemetry {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
